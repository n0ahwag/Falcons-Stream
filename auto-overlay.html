<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Floorball Pro Broadcast</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: transparent; }

        #event-wrapper {
            position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
            perspective: 1200px;
        }

        .broadcast-card {
            width: 550px; background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(25px);
            border-radius: 4px; color: white; display: flex; align-items: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.1);
            
            /* Hidden State */
            opacity: 0; transform: translateY(100px) rotateX(-45deg);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            visibility: hidden; padding: 25px;
        }

        .broadcast-card.active { opacity: 1; transform: translateY(0) rotateX(0deg); visibility: visible; }

        .accent-bar { position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: #ff0000; }

        .side-info {
            width: 80px; font-weight: 900; font-size: 30px; color: #ff0000;
            border-right: 1px solid rgba(255,255,255,0.1); margin-right: 25px; text-align: center;
        }

        .main-info { flex-grow: 1; }
        .label { font-size: 12px; text-transform: uppercase; letter-spacing: 5px; color: #888; margin-bottom: 5px; }
        .player-name { font-size: 32px; font-weight: 900; text-transform: uppercase; line-height: 1; margin-bottom: 5px; letter-spacing: -1px; }
        .sub-text { font-size: 16px; color: rgba(255,255,255,0.5); font-style: italic; }

        /* Timer Progress */
        .progress { position: absolute; bottom: 0; left: 0; height: 3px; background: #ff0000; width: 0%; }
        .active .progress { animation: countdown 7s linear forwards; }
        @keyframes countdown { from { width: 100%; } to { width: 0%; } }
    </style>
</head>

                <div id="sub" class="sub-text">Assist: Moritz Hörbe</div>

            <div class="progress"></div>
        </div>
    </div>

        function showEvent(ev) {
            const isGoal = ev.type === 'goal';
            const isPenalty = ev.type == 'penalty';
            document.getElementById('label').innerText = isGoal ? "Tor erzielt" : "Zeitstrafe";
            document.getElementById('accent').style.background = isGoal ? "#ff0000" : "#ffffff";
            document.getElementById('time').innerText = ev.game_time + "'";
            document.getElementById('time').style.color = isGoal ? "#ff0000" : "#ffffff";
            
            if (isGoal || isPenalty) {
                const players = ev.players[ev.event_team];
                let detail = "", playerText = "";

                for (const player in players) {
                    if (player.trikot_number == ev.number) {
                        playerText = `${player.player_firstname} ${player.player_name}`;
                        break;
                    }
                }

                if (isPenalty) {
                    detail = `${ev.duration} Min - ${ev.penalty_type}`;
                }
                else if (ev.assist) {
                    for (const player in players) {
                        if (player.trikot_number == ev.assist) {
                            detail = `${player.player_firstname} ${player.player_name}`;
                            break;
                        }
                    }
                }
            
                document.getElementById('player').innerText = player;
                document.getElementById('sub').innerText = detail;
            }
            const card = document.getElementById('card');
            card.classList.add('active');
            setTimeout(() => card.classList.remove('active'), 7000);
        }
