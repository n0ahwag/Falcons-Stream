<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Floorball Elite Broadcast - FIFA Style</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: transparent; }

        #viewport {
            position: absolute;
            bottom: 8%; left: 50%;
            transform: translateX(-50%);
            width: 1200px; height: 120px;
            display: flex; align-items: center; justify-content: center;
        }

        /* Die gesamte Einheit */
        .graphic-unit {
            display: flex;
            align-items: center;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            visibility: hidden;
        }
        #viewport.active .graphic-unit { opacity: 1; transform: scale(1); visibility: visible; }

        /* Links: Roter Status-Tag (TOR / STRAFE) */
        .tag-container {
            position: relative;
            height: 80px; width: 0; /* Start */
            background: #e60000;
            transform: skewX(-15deg);
            overflow: hidden;
            z-index: 10;
            transition: width 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            display: flex; align-items: center; justify-content: center;
        }
        #viewport.active .tag-container { width: 140px; }

        .tag-text {
            transform: skewX(15deg) translateY(100%);
            color: #fff; font-weight: 900; font-size: 20px; text-transform: uppercase;
            transition: transform 0.5s 0.4s cubic-bezier(0.2, 1, 0.3, 1);
        }
        #viewport.active .tag-text { transform: skewX(15deg) translateY(0); }

        /* Rechts: Haupt-Datenbox */
        .data-box {
            position: relative;
            height: 80px; width: 0; /* Start */
            background: rgba(15, 15, 15, 0.98);
            backdrop-filter: blur(20px);
            transform: skewX(-15deg);
            margin-left: -10px; /* Schmiegt sich an den Tag an */
            border-right: 6px solid #e60000;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            overflow: hidden;
            transition: width 0.6s 0.1s cubic-bezier(0.2, 1, 0.3, 1);
        }
        #viewport.active .data-box { width: 800px; }

        /* Innen-Inhalt (muss Skew zurückrechnen!) */
        .inner-content {
            transform: skewX(15deg);
            height: 100%;
            display: flex; align-items: center;
            padding: 0 40px 0 30px; /* Genug Abstand wegen der Schräge */
            opacity: 0;
            transition: opacity 0.4s 0.6s;
        }
        #viewport.active .inner-content { opacity: 1; }

        /* Maskierte Namen-Animation */
        .name-reveal {
            overflow: hidden;
            flex-grow: 1;
            max-width: 450px;
        }
        .player-name {
            font-size: 36px; font-weight: 900; text-transform: uppercase;
            color: #fff; letter-spacing: -1px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transform: translateY(110%);
            transition: transform 0.6s 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }
        #viewport.active .player-name { transform: translateY(0); }

        /* Assist / Detail Animation */
        .detail-reveal {
            margin-left: 20px;
            overflow: hidden;
            max-width: 200px;
        }
        .detail-text {
            font-size: 16px; color: #888; font-weight: 700; text-transform: uppercase;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transform: translateY(110%);
            transition: transform 0.6s 0.7s cubic-bezier(0.2, 1, 0.3, 1);
        }
        #viewport.active .detail-text { transform: translateY(0); }

        /* Zeit Minute */
        .time-reveal {
            margin-left: auto;
            overflow: hidden;
        }
        .time-text {
            font-size: 42px; font-weight: 900; color: #e60000;
            transform: scale(0.5); opacity: 0;
            transition: all 0.5s 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.28);
        }
        #viewport.active .time-text { transform: scale(1); opacity: 1; }

        /* Shimmer Glanz */
        .shimmer {
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            transition: 0s;
        }
        #viewport.active .shimmer {
            left: 200%;
            transition: 1.5s 0.8s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div class="graphic-unit">
            <!-- Roter Label Tag -->
            <div id="tag-bg" class="tag-container">
                <div id="tag-text" class="tag-text">GOAL</div>
            </div>

            <!-- Haupt-Datenbox -->
            <div class="data-box">
                <div class="shimmer"></div>
                <div class="inner-content">
                    <div class="name-reveal">
                        <div id="player" class="player-name">---</div>
                    </div>
                    <div class="detail-reveal">
                        <div id="detail" class="detail-text">---</div>
                    </div>
                    <div class="time-reveal">
                        <div id="time" class="time-text">0'</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const viewport = document.getElementById('viewport');

        let lastTs = 0;

        db.ref('triggered_event').on('value', snap => {
            const val = snap.val();
            if(!val || val.timestamp <= lastTs) return;
            lastTs = val.timestamp;
            
            const ev = val.data;
            const isGoal = ev.type === 'goal';

            // UI Inhalte setzen
            document.getElementById('tag-text').innerText = isGoal ? "GOAL" : "PENALTY";
            document.getElementById('tag-bg').style.background = isGoal ? "#e60000" : "#ffffff";
            document.getElementById('tag-text').style.color = isGoal ? "#ffffff" : "#000000";
            
            document.getElementById('player').innerText = ev.player;
            document.getElementById('detail').innerText = ev.detail;
            document.getElementById('time').innerText = ev.time;

            // Animation Sequenz resetten & starten
            viewport.classList.remove('active');
            void viewport.offsetWidth; 
            viewport.classList.add('active');

            setTimeout(() => { viewport.classList.remove('active'); }, 7000);
        });
    </script>
</body>
</html>
