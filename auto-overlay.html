<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Elite Broadcast Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root {
            --primary-color: #ff0000;
            --accent-color: #ffffff;
        }

        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: transparent; }

        #viewport {
            position: absolute;
            bottom: 12%; left: 50%;
            transform: translateX(-50%);
            width: 1000px; height: 120px;
            display: flex; align-items: center; justify-content: center;
        }

        .graphic-unit {
            display: flex; align-items: stretch;
            height: 85px; opacity: 0;
            transform: translateY(40px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            visibility: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        #viewport.active .graphic-unit { opacity: 1; transform: translateY(0); visibility: visible; }

        /* Linker Block: Typ (TOR/STRAFE) */
        .side-block {
            background: var(--primary-color);
            width: 0; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            transition: width 0.5s 0.1s cubic-bezier(0.8, 0, 0.2, 1);
        }
        #viewport.active .side-block { width: 140px; }

        .side-text {
            color: var(--accent-color); font-weight: 900; font-size: 20px;
            text-transform: uppercase; letter-spacing: 2px;
            opacity: 0; transition: opacity 0.3s 0.5s;
        }
        #viewport.active .side-text { opacity: 1; }

        /* Rechter Block: Daten */
        .main-block {
            background: rgba(10, 10, 12, 0.98);
            backdrop-filter: blur(20px);
            width: 0; overflow: hidden;
            display: flex; align-items: center;
            transition: width 0.7s 0.2s cubic-bezier(0.8, 0, 0.2, 1);
            position: relative;
        }
        #viewport.active .main-block { width: 700px; }

        .content-reveal {
            display: flex; align-items: center; width: 100%;
            padding: 0 40px; opacity: 0;
            transform: translateX(-20px);
            transition: all 0.5s 0.7s ease-out;
        }
        #viewport.active .content-reveal { opacity: 1; transform: translateX(0); }

        .player-info { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .player-name {
            font-size: 32px; font-weight: 900; text-transform: uppercase;
            color: white; line-height: 1; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .detail-text {
            font-size: 16px; color: rgba(255,255,255,0.5);
            font-style: italic; margin-top: 4px;
        }

        .time-display {
            font-size: 40px; font-weight: 900; color: var(--primary-color);
            margin-left: 30px; padding-left: 30px;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        /* Progress Bar */
        .progress-line {
            position: absolute; bottom: 0; left: 0;
            height: 4px; background: var(--primary-color);
            width: 0%;
        }
        #viewport.active .progress-line { animation: timer 7s linear forwards; }
        @keyframes timer { from { width: 100%; } to { width: 0%; } }
    </style>
</head>
<body>
    <div id="viewport">
        <div class="graphic-unit">
            <div id="sideB" class="side-block">
                <div id="typeText" class="side-text">GOAL</div>
            </div>
            <div class="main-block">
                <div class="content-reveal">
                    <div class="player-info">
                        <span id="pName" class="player-name">-</span>
                        <span id="pDetail" class="detail-text">-</span>
                    </div>
                    <div id="pTime" class="time-display">0'</div>
                </div>
                <div id="prog" class="progress-line"></div>
            </div>
        </div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // Listen to Color Settings
        db.ref('auto_settings/colors').on('value', snap => {
            const colors = snap.val();
            if(colors) {
                document.documentElement.style.setProperty('--primary-color', colors.primary);
                document.documentElement.style.setProperty('--accent-color', colors.accent);
            }
        });

        let lastTs = 0;
        db.ref('triggered_event').on('value', snap => {
            const val = snap.val();
            if(!val || val.timestamp <= lastTs) return;
            lastTs = val.timestamp;
            const ev = val.data;
            
            document.getElementById('typeText').innerText = ev.type === 'goal' ? "GOAL" : "PENALTY";
            document.getElementById('pName').innerText = ev.player;
            document.getElementById('pDetail').innerText = ev.detail;
            document.getElementById('pTime').innerText = ev.time;

            const vp = document.getElementById('viewport');
            vp.classList.remove('active');
            void vp.offsetWidth;
            vp.classList.add('active');
            setTimeout(() => vp.classList.remove('active'), 7000);
        });
    </script>
</body>
</html>
