<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Floorball Elite Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            font-family: 'Inter', sans-serif; background: transparent; 
        }

        /* Haupt-Container: Position 7/8 unten */
        #viewport {
            position: absolute;
            bottom: 12%; 
            left: 50%;
            transform: translateX(-50%);
            width: 1000px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Maske für den Reveal */
        }

        /* Der Hintergrund-Layer */
        #main-card {
            position: relative;
            background: rgba(20, 20, 25, 0.95); /* Dunkles Anthrazit, kein reines Schwarz */
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0;
            height: 100px;
            width: 0; /* Startzustand */
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transition: width 0.7s cubic-bezier(0.8, 0, 0.1, 1);
        }

        /* Rote Akzent-Linie */
        #accent-bar {
            width: 8px;
            height: 100%;
            background: #ff0000;
            transform: scaleY(0);
            transition: transform 0.4s 0.4s cubic-bezier(0.8, 0, 0.1, 1);
        }

        /* Inhalts-Container mit Maskierung */
        #content {
            display: flex;
            align-items: center;
            opacity: 0;
            transform: translateX(-20px);
            white-space: nowrap;
            padding-left: 30px;
            padding-right: 40px;
            transition: all 0.5s 0.6s ease-out;
        }

        /* Zeit-Box (Minute) */
        .time-box {
            font-size: 45px;
            font-weight: 900;
            color: #ff0000;
            margin-right: 30px;
            padding-right: 25px;
            border-right: 2px solid rgba(255,255,255,0.1);
            min-width: 70px;
            text-align: center;
        }

        .info-text {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #ff0000; /* Leuchtendes Rot */
            margin-bottom: 2px;
        }

        .player-name {
            font-size: 36px;
            font-weight: 900;
            text-transform: uppercase;
            color: #ffffff; /* Weiß auf Dunkelgrau = Maximaler Kontrast */
            line-height: 1;
            letter-spacing: -1px;
        }

        .detail-text {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
            margin-top: 4px;
        }

        /* --- ANIMATION TRIGGER --- */
        #viewport.active #main-card { width: 750px; }
        #viewport.active #accent-bar { transform: scaleY(1); }
        #viewport.active #content { opacity: 1; transform: translateX(0); }

        /* Timer-Balken oben drauf */
        #timer-line {
            position: absolute;
            top: 0; left: 0;
            height: 3px;
            background: #ff0000;
            width: 0%;
        }
        #viewport.active #timer-line {
            animation: timer-run 7s linear forwards;
        }

        @keyframes timer-run { from { width: 100%; } to { width: 0%; } }

        /* Glanz-Effekt */
        .shimmer {
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0s;
        }
        #viewport.active .shimmer {
            left: 100%;
            transition: 1.5s 0.8s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="main-card">
            <div id="accent-bar"></div>
            <div id="timer-line"></div>
            <div class="shimmer"></div>
            
            <div id="content">
                <div id="time" class="time-box">0'</div>
                <div class="info-text">
                    <div id="label" class="label">Tor erzielt</div>
                    <div id="player" class="player-name">-</div>
                    <div id="detail" class="detail-text">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const viewport = document.getElementById('viewport');

        let lastEventTs = 0;

        db.ref('triggered_event').on('value', snap => {
            const val = snap.val();
            if(!val || val.timestamp <= lastEventTs) return;
            lastEventTs = val.timestamp;
            
            const ev = val.data;
            const isGoal = ev.type === 'goal';

            // UI Texte setzen
            document.getElementById('label').innerText = isGoal ? "Tor erzielt" : "Zeitstrafe";
            document.getElementById('label').style.color = isGoal ? "#ff0000" : "#ffffff";
            document.getElementById('accent-bar').style.background = isGoal ? "#ff0000" : "#ffffff";
            document.getElementById('time').innerText = ev.time;
            document.getElementById('time').style.color = isGoal ? "#ff0000" : "#ffffff";
            document.getElementById('player').innerText = ev.player;
            document.getElementById('detail').innerText = ev.detail;

            // Animation Sequenz
            viewport.classList.remove('active');
            void viewport.offsetWidth; // Force Reflow
            viewport.classList.add('active');

            // Nach 7 Sekunden wieder ausblenden
            setTimeout(() => {
                viewport.classList.remove('active');
            }, 7000);
        });
    </script>
</body>
</html>
