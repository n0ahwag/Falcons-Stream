<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Floorball Elite Broadcast</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            font-family: 'Inter', sans-serif; background: transparent; 
        }

        /* Haupt-Positionierung (7/8 unten) */
        #viewport {
            position: absolute;
            bottom: 12%; 
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1200px;
            height: 120px;
            overflow: hidden; /* Die Maske für die Animation */
        }

        /* Der linke, farbige Block (Status: TOR / STRAFE) */
        #type-block {
            width: 0; /* Start bei 0 */
            height: 80px;
            background: #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: width 0.5s cubic-bezier(0.8, 0, 0.2, 1);
            overflow: hidden;
            z-index: 2;
        }

        #type-text {
            color: #ffffff; /* Knallweiß auf Rot */
            font-weight: 900;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        /* Der rechte, dunkle Block (Name & Assist) */
        #name-block {
            width: 0; /* Start bei 0 */
            height: 80px;
            background: rgba(15, 15, 15, 0.98); /* Sehr dunkles Grau (fast Schwarz) */
            display: flex;
            align-items: center;
            transition: width 0.6s 0.1s cubic-bezier(0.8, 0, 0.2, 1);
            overflow: hidden;
            border-left: 2px solid rgba(255,255,255,0.1);
        }

        /* Content-Reveal innerhalb des dunklen Blocks */
        #content-reveal {
            display: flex;
            align-items: center;
            padding: 0 40px;
            opacity: 0;
            transform: translateX(-30px);
            transition: all 0.5s 0.6s ease-out;
            white-space: nowrap;
        }

        /* Texte im dunklen Block */
        .player-name {
            color: #ffffff !important; /* IMMER WEISS */
            font-size: 34px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1;
            margin-right: 25px;
        }

        .sub-info {
            color: #aaaaaa !important; /* HELLGRAU für Assist */
            font-size: 18px;
            font-weight: 400;
            font-style: italic;
        }

        /* Minute (ganz rechts) */
        #time-box {
            margin-left: auto;
            color: #ff0000 !important;
            font-weight: 900;
            font-size: 38px;
            padding-left: 25px;
            border-left: 2px solid rgba(255,255,255,0.1);
        }

        /* --- ANIMATION TRIGGER --- */
        #viewport.active #type-block { width: 140px; }
        #viewport.active #name-block { width: 700px; }
        #viewport.active #content-reveal { opacity: 1; transform: translateX(0); }

        /* Timer Balken unten drunter */
        #progress-line {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 4px;
            background: #ff0000;
            transition: width 0.5s 0.2s;
        }
        #viewport.active #progress-line { width: 840px; } /* Summe aus beiden Blöcken */

    </style>
</head>
<body>

    <div id="viewport">
        <div id="type-block">
            <div id="type-text">TOR</div>
        </div>
        <div id="name-block">
            <div id="content-reveal">
                <div id="player" class="player-name">NAME DES SPIELERS</div>
                <div id="sub" class="sub-info">Assist: Name</div>
                <div id="time" class="time-box">12'</div>
            </div>
        </div>
        <div id="progress-line"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const viewport = document.getElementById('viewport');

        let lastTs = 0;

        db.ref('triggered_event').on('value', snap => {
            const val = snap.val();
            if(!val || val.timestamp <= lastTs) return;
            lastTs = val.timestamp;
            
            const ev = val.data;
            const isGoal = ev.type === 'goal';

            // UI anpassen
            document.getElementById('type-text').innerText = isGoal ? "TOR" : "STRAFE";
            document.getElementById('type-block').style.background = isGoal ? "#ff0000" : "#ffffff";
            document.getElementById('type-text').style.color = isGoal ? "#ffffff" : "#000000"; // Schwarz nur AUF dem weißen Straf-Block
            
            document.getElementById('player').innerText = ev.player;
            document.getElementById('sub').innerText = ev.detail;
            document.getElementById('time').innerText = ev.time;

            // Animation Sequenz
            viewport.classList.remove('active');
            void viewport.offsetWidth; // Trigger CSS Restart
            viewport.classList.add('active');

            setTimeout(() => {
                viewport.classList.remove('active');
            }, 7000);
        });
    </script>
</body>
</html>
