<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Elite Broadcast Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root {
            --team-main: #ff0000;
            --team-accent: #ffffff;
        }

        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: transparent; }

        #viewport {
            position: absolute;
            bottom: 12%; left: 50%;
            transform: translateX(-50%);
            width: 1000px; height: 120px;
            display: flex; align-items: center; justify-content: center;
        }

        .graphic-unit {
            display: flex;
            height: 80px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            /* Reveal Animation via Clip-Path (Keine Text-Verzerrung!) */
            clip-path: inset(0 100% 0 0);
            transition: clip-path 0.8s cubic-bezier(0.8, 0, 0.2, 1);
            visibility: hidden;
        }

        #viewport.active .graphic-unit {
            clip-path: inset(0 0 0 0);
            visibility: visible;
        }

        /* Label Block (Links) */
        .label-block {
            background: var(--team-main);
            color: var(--team-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 30px;
            font-weight: 900;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Data Block (Mitte/Rechts) */
        .data-block {
            background: rgba(10, 10, 12, 0.98);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            padding: 0 40px;
            min-width: 500px;
            border-right: 5px solid var(--team-main);
        }

        .player-info {
            display: flex;
            flex-direction: column;
            margin-right: 40px;
        }

        .player-name {
            font-size: 34px;
            font-weight: 900;
            text-transform: uppercase;
            color: white;
            line-height: 1;
            white-space: nowrap;
        }

        .detail-text {
            font-size: 16px;
            color: rgba(255,255,255,0.5);
            font-style: italic;
            margin-top: 5px;
        }

        .time-display {
            margin-left: auto;
            font-size: 42px;
            font-weight: 900;
            color: var(--team-main);
            padding-left: 30px;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        /* Progress Bar unten am dunklen Block */
        .progress-bar {
            position: absolute; bottom: 0; left: 0;
            height: 4px; background: var(--team-main);
            width: 0%;
        }
        #viewport.active .progress-bar { animation: timer 7s linear forwards; }
        @keyframes timer { from { width: 100%; } to { width: 0%; } }
    </style>
</head>
<body>
    <div id="viewport">
        <div class="graphic-unit">
            <div id="labelBox" class="label-block">GOAL</div>
            <div class="data-block">
                <div class="player-info">
                    <span id="pName" class="player-name">-</span>
                    <span id="pDetail" class="detail-text">-</span>
                </div>
                <div id="pTime" class="time-display">0'</div>
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let lastTs = 0;
        db.ref('triggered_event').on('value', snap => {
            const val = snap.val();
            if(!val || val.timestamp <= lastTs) return;
            lastTs = val.timestamp;
            
            const ev = val.data;
            const colors = val.colors; // Wir bekommen die Farben direkt mit dem Event!

            // 1. Farben sofort setzen (vor der Animation)
            document.documentElement.style.setProperty('--team-main', colors.main);
            document.documentElement.style.setProperty('--team-accent', colors.accent);

            // 2. Texte setzen
            document.getElementById('labelBox').innerText = ev.type === 'goal' ? "GOAL" : "PENALTY";
            document.getElementById('pName').innerText = ev.player;
            document.getElementById('pDetail').innerText = ev.detail;
            document.getElementById('pTime').innerText = ev.time;

            // 3. Animation starten
            const vp = document.getElementById('viewport');
            vp.classList.remove('active');
            void vp.offsetWidth;
            vp.classList.add('active');
            setTimeout(() => vp.classList.remove('active'), 7000);
        });
    </script>
</body>
</html>
