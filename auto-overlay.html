<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Floorball Pro Broadcast - FIFA Style</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            font-family: 'Inter', sans-serif; background: transparent; 
        }

        /* Haupt-Container am unteren Rand */
        #viewport {
            position: absolute;
            bottom: 8%; 
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1400px;
            height: 180px;
        }

        /* Der animierte "Revealer" Rahmen */
        .graphic-container {
            position: relative;
            display: flex;
            align-items: center;
            opacity: 0;
            transform: scaleX(0.8);
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            visibility: hidden;
        }

        #viewport.active .graphic-container {
            opacity: 1;
            transform: scaleX(1);
            visibility: visible;
        }

        /* Schräger Hintergrund-Block (Parallelogramm) */
        .bg-shape {
            position: absolute;
            height: 90px;
            background: linear-gradient(135deg, rgba(15,15,15,0.98) 0%, rgba(5,5,5,0.95) 100%);
            backdrop-filter: blur(20px);
            transform: skewX(-15deg);
            border-left: 6px solid #e60000;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            width: 0;
            transition: width 0.6s 0.1s cubic-bezier(0.2, 1, 0.3, 1);
            z-index: 1;
        }
        #viewport.active .bg-shape { width: 850px; }

        /* Der farbige Info-Tag (TOR / STRAFE) */
        .info-tag {
            position: relative;
            z-index: 5;
            height: 90px;
            width: 0;
            background: #e60000;
            transform: skewX(-15deg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: width 0.5s 0s cubic-bezier(0.2, 1, 0.3, 1);
        }
        #viewport.active .info-tag { width: 140px; }

        .tag-text {
            transform: skewX(15deg) translateY(100%);
            color: #fff;
            font-weight: 900;
            font-size: 22px;
            text-transform: uppercase;
            transition: transform 0.5s 0.4s cubic-bezier(0.2, 1, 0.3, 1);
        }
        #viewport.active .tag-text { transform: skewX(15deg) translateY(0); }

        /* Text-Ebene mit Maskierung */
        .content-layer {
            position: relative;
            z-index: 4;
            display: flex;
            align-items: center;
            padding-left: 40px;
            white-space: nowrap;
            overflow: hidden;
        }

        .name-wrapper {
            overflow: hidden;
            height: 50px;
            display: flex;
            align-items: center;
        }

        .player-name {
            font-size: 42px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1.5px;
            color: #fff;
            transform: translateY(110%);
            transition: transform 0.6s 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }
        #viewport.active .player-name { transform: translateY(0); }

        .detail-wrapper {
            margin-left: 30px;
            overflow: hidden;
            height: 30px;
        }

        .detail-text {
            font-size: 18px;
            color: #aaa;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
            transform: translateY(110%);
            transition: transform 0.6s 0.7s cubic-bezier(0.2, 1, 0.3, 1);
        }
        #viewport.active .detail-text { transform: translateY(0); }

        /* Zeit-Anzeige Badge */
        .time-badge {
            margin-left: 40px;
            font-size: 48px;
            font-weight: 900;
            color: #e60000;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.28);
        }
        #viewport.active .time-badge { opacity: 1; transform: scale(1); }

        /* Glanz-Effekt Animation (Shimmer) */
        .shimmer {
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            z-index: 10;
            transform: skewX(-15deg);
        }
        #viewport.active .shimmer {
            left: 200%;
            transition: 1.5s 1s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div class="graphic-container">
            <!-- Roter Label Block -->
            <div id="tag-bg" class="info-tag">
                <div id="tag-text" class="tag-text">GOAL</div>
            </div>

            <!-- Haupt-Hintergrund -->
            <div class="bg-shape">
                <div class="shimmer"></div>
            </div>

            <!-- Inhalts-Texte -->
            <div class="content-layer">
                <div class="name-wrapper">
                    <div id="player" class="player-name">---</div>
                </div>
                <div class="detail-wrapper">
                    <div id="detail" class="detail-text">---</div>
                </div>
                <div id="time" class="time-badge">0'</div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const viewport = document.getElementById('viewport');

        let lastTs = 0;

        db.ref('triggered_event').on('value', snap => {
            const val = snap.val();
            if(!val || val.timestamp <= lastTs) return;
            lastTs = val.timestamp;
            
            const ev = val.data;
            const isGoal = ev.type === 'goal';

            // UI anpassen
            document.getElementById('tag-text').innerText = isGoal ? "GOAL" : "PENALTY";
            document.getElementById('tag-bg').style.background = isGoal ? "#e60000" : "#ffffff";
            document.getElementById('tag-text').style.color = isGoal ? "#ffffff" : "#000000";
            
            document.getElementById('player').innerText = ev.player;
            document.getElementById('detail').innerText = ev.detail;
            document.getElementById('time').innerText = ev.time;

            // Animation Sequenz starten
            viewport.classList.remove('active');
            void viewport.offsetWidth; // DOM Refresh
            viewport.classList.add('active');

            // Nach 7 Sekunden ausblenden
            setTimeout(() => {
                viewport.classList.remove('active');
            }, 7000);
        });
    </script>
</body>
</html>
