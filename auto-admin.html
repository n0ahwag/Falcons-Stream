<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Broadcast Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: transparent; }

        #container {
            position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
            perspective: 1000px;
        }

        .card {
            width: 500px; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px);
            border-radius: 4px; color: white; display: flex; align-items: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1);
            padding: 20px 30px;
            /* Animation hidden state */
            opacity: 0; transform: rotateX(-90deg) translateY(50px);
            transition: all 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.28);
            visibility: hidden;
        }

        .card.active { opacity: 1; transform: rotateX(0deg) translateY(0); visibility: visible; }

        .time-badge {
            font-size: 38px; font-weight: 900; color: #ff0000;
            padding-right: 25px; margin-right: 25px;
            border-right: 2px solid rgba(255,255,255,0.1);
        }

        .main { flex-grow: 1; }
        .label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 5px; color: #888; margin-bottom: 3px; }
        .player { font-size: 28px; font-weight: 900; text-transform: uppercase; line-height: 1.1; letter-spacing: -1px; }
        .sub { font-size: 15px; color: rgba(255,255,255,0.5); font-style: italic; margin-top: 2px; }

        .progress-bar { position: absolute; bottom: 0; left: 0; height: 4px; background: #ff0000; width: 0%; }
        .active .progress-bar { animation: progress 7s linear forwards; }
        @keyframes progress { from { width: 100%; } to { width: 0%; } }
    </style>
</head>
<body>

    <div id="container">
        <div id="card" class="card">
            <div id="time" class="time-badge">0'</div>
            <div class="main">
                <div id="label" class="label">Tor erzielt</div>
                <div id="player" class="player">-</div>
                <div id="sub" class="sub">-</div>
            </div>
            <div class="progress-bar"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let lastTs = 0;
        db.ref('triggered_event').on('value', snap => {
            const val = snap.val();
            if(!val || val.timestamp <= lastTs) return;
            lastTs = val.timestamp;
            
            const ev = val.data;
            const isGoal = ev.type === 'goal';
            
            document.getElementById('time').innerText = ev.game_time + "'";
            document.getElementById('time').style.color = isGoal ? "#ff0000" : "#ffffff";
            document.getElementById('label').innerText = isGoal ? "Tor erzielt" : "Zeitstrafe";
            
            const p = isGoal ? ev.scorer : ev.player;
            document.getElementById('player').innerText = p.firstname + " " + p.lastname;
            document.getElementById('sub').innerText = isGoal ? (ev.assist ? "Assist: " + ev.assist.firstname + " " + ev.assist.lastname : "") : (ev.duration + " Min - " + ev.penalty_type);

            const card = document.getElementById('card');
            card.classList.add('active');
            setTimeout(() => card.classList.remove('active'), 7000);
        });
    </script>
</body>
</html>
