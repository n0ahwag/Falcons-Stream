<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Broadcast Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: transparent; }

        #container {
            position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
            perspective: 1000px;
        }

        .card {
            width: 500px; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px);
            border-radius: 4px; color: white; display: flex; align-items: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1);
            padding: 20px 30px;
            /* Animation hidden state */
            opacity: 0; transform: rotateX(-90deg) translateY(50px);
            transition: all 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.28);
            visibility: hidden;
        }

        .card.active { opacity: 1; transform: rotateX(0deg) translateY(0); visibility: visible; }

        .time-badge {
            font-size: 38px; font-weight: 900; color: #ff0000;
            padding-right: 25px; margin-right: 25px;
            border-right: 2px solid rgba(255,255,255,0.1);
        }

        .main { flex-grow: 1; }
        .label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 5px; color: #888; margin-bottom: 3px; }
        .player { font-size: 28px; font-weight: 900; text-transform: uppercase; line-height: 1.1; letter-spacing: -1px; }
        .sub { font-size: 15px; color: rgba(255,255,255,0.5); font-style: italic; margin-top: 2px; }

        .progress-bar { position: absolute; bottom: 0; left: 0; height: 4px; background: #ff0000; width: 0%; }
        .active .progress-bar { animation: progress 7s linear forwards; }
        @keyframes progress { from { width: 100%; } to { width: 0%; } }
    </style>
</head>
<body>

    <div id="container">
        <div id="card" class="card">
            <div id="time" class="time-badge">0'</div>
            <div class="main">
                <div id="label" class="label">Tor erzielt</div>
                <div id="player" class="player">-</div>
                <div id="sub" class="sub">-</div>
            </div>
            <div class="progress-bar"></div>
        </div>
    </div>
    <div id="timeline"></div>
    <form>
        <label for="gameId">Game-ID:</label><br>
        <input type="text" id="gameId" value="00000"><br>
        <button onclick="updateGameId()">Submit</button>
    </form>
    <form>
        <input type="checkbox" id="autoToggle" value="toggle" onclick="toggleAutoMode()">
        <label for="autoToggle">Auto-Mode</label>
    </form>
    <p id="sync-status"></p>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activeId = "";
        let autoMode = false;
        let lastLength = null;
        let players = null;

        db.ref('auto_settings').on('value', snap => {
            const val = snap.val() || {};
            activeId = val.gameId || "";
            autoMode = val.autoMode || false;
            document.getElementById('gameId').value = activeId;
            document.getElementById('autoToggle').checked = autoMode;
            if(activeId) fetchTimeline();
        });

        function updateGameId() {
            const id = document.getElementById('gameId').value;
            if(id.length !== 5) return alert("Bitte eine gültige Spiel-ID eingeben!");
            db.ref('auto_settings/gameId').set(id);
            // Reset Länge damit neue Events vom neuen Spiel getrackt werden
            lastLength = 0; 
        }

        function toggleAutoMode() {
            const mode = document.getElementById('autoToggle').checked;
            db.ref('auto_settings/autoMode').set(mode);
        }

        async function fetchTimeline() {
            if(!activeId) return;
            const status = document.getElementById('sync-status');
            
            try {
                const url = `https://saisonmanager.de/api/v2/games/${activeId}.json`;

                let response = null;
                for (let i = 0; i < 3; i++) {
                    response = await fetch(url);
                    if (response.ok) break;
                }

                const data = await response.json();
                players = data.players;

                renderTimeline(data.events);
                checkAutoTrigger(data.events);

                document.getElementById('sync-status').innerText = "Letzter Sync: " + new Date().toLocaleTimeString();
                status.innerText = "Letzter Sync: " + new Date().toLocaleTimeString();
                status.style.color = "#00ff00";
            } catch (e) {
                document.getElementById('sync-status').innerText = "Sync Fehler!";
                console.error("Sync Error:", e);
                status.innerText = "Sync Fehler! (Eventuell falsche ID?)";
                status.style.color = "#ff4444";
            }
        }

        function renderTimeline(events) {
            const container = document.getElementById('timeline');
            container.innerHTML = '<h3 style="margin-bottom:15px">Ereignisse des Spiels</h3>';
            if(events.length === 0) { container.innerHTML += '<div style="color:#555">Noch keine Ereignisse eingetragen.</div>'; return; }

            let lastPeriod = 0;

            events.forEach(ev => {
                const div = document.createElement('div');
                div.className = `event-item ${ev.event_type}`;
                
                const isGoal = ev.event_type == 'goal';
                const isPenalty = ev.event_type == 'penalty';
                if (isGoal || isPenalty) {
                    const teamPlayers = players[ev.event_team];
                    let detail = "", playerText = "";

                    for (const i in teamPlayers) {
                        const player = teamPlayers[i]
                        if (player.trikot_number == ev.number) {
                            playerText = `${player.player_firstname} ${player.player_name}`;
                            break;
                        }
                    }

                    if (isPenalty) {
                        detail = `${ev.penalty_type_string} - ${ev.penalty_reason_string}`;
                    }
                    else if (ev.assist) {
                        for (const i in teamPlayers) {
                            const player = teamPlayers[i]
                            if (player.trikot_number == ev.assist) {
                                detail = `${player.player_firstname} ${player.player_name}`;
                                break;
                            }
                        }
                    }

                    div.innerHTML = `
                        <div class="event-time">${ev.time}</div>
                        <div class="event-info">
                            <span class="event-player">${playerText}</span>
                            <span class="event-detail">${detail}</span>
                        </div>
                    `;

                    //div.onclick = () => triggerOverlay(ev);
                    for (let i = lastPeriod+1; i <= ev.period; i++) {
                        const div2 = document.createElement('div');
                        div2.innerHTML = `
                            <span>${i}. Periode</span>
                        `
                        container.appendChild(div2);
                    }
                    container.appendChild(div);
                    
                    lastPeriod = ev.period;
                }
            });
        }

        function checkAutoTrigger(events) {
            if (autoMode) {
                for (let i = lastLength; i < events.length; i++) {
                    //triggerOverlay(events[i]);
                }
            }

            lastLength = events.length;
        }

        function triggerOverlay(ev) {
            db.ref('triggered_event').set({
                data: ev,
                timestamp: Date.now()
            });
        }

        /*let lastTs = 0;
        db.ref('triggered_event').on('value', snap => {
            const val = snap.val();
            if(!val || val.timestamp <= lastTs) return;
            lastTs = val.timestamp;
            
            const ev = val.data;
            const isGoal = ev.type === 'goal';
            
            document.getElementById('time').innerText = ev.game_time + "'";
            document.getElementById('time').style.color = isGoal ? "#ff0000" : "#ffffff";
            document.getElementById('label').innerText = isGoal ? "Tor erzielt" : "Zeitstrafe";
            
            const p = isGoal ? ev.scorer : ev.player;
            document.getElementById('player').innerText = p.firstname + " " + p.lastname;
            document.getElementById('sub').innerText = isGoal ? (ev.assist ? "Assist: " + ev.assist.firstname + " " + ev.assist.lastname : "") : (ev.duration + " Min - " + ev.penalty_type);

            const card = document.getElementById('card');
            card.classList.add('active');
            setTimeout(() => card.classList.remove('active'), 7000);
        });*/

        setInterval(fetchTimeline, 5000);
    </script>
</body>
</html>
