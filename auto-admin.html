<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Floorball Elite Broadcast Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: transparent; }
        #broadcast-wrapper { position: absolute; bottom: 12.5%; left: 50%; transform: translateX(-50%); display: flex; align-items: center; overflow: hidden; }
        #main-bar { position: relative; height: 95px; width: 0; background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(15px); display: flex; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); transition: width 0.7s cubic-bezier(0.85, 0, 0.15, 1); border-radius: 4px; }
        #accent-stripe { position: absolute; left: 0; top: 0; width: 12px; height: 100%; background: #ff0000; transform: scaleY(0); transition: transform 0.4s 0.3s cubic-bezier(0.85, 0, 0.15, 1); }
        #content-layer { padding: 0 45px 0 35px; display: flex; align-items: center; opacity: 0; transform: translateX(-30px); transition: all 0.6s 0.5s ease-out; white-space: nowrap; }
        #broadcast-wrapper.active #main-bar { width: 700px; }
        #broadcast-wrapper.active #accent-stripe { transform: scaleY(1); }
        #broadcast-wrapper.active #content-layer { opacity: 1; transform: translateX(0); }
        .time-box { font-size: 42px; font-weight: 900; margin-right: 30px; padding-right: 25px; border-right: 2px solid rgba(255,255,255,0.1); }
        .main-info { display: flex; flex-direction: column; }
        .label { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 4px; color: #ff0000; margin-bottom: 2px; }
        .player-name { font-size: 34px; font-weight: 900; text-transform: uppercase; line-height: 1; color: #fff; }
        .sub-text { font-size: 16px; color: rgba(255,255,255,0.6); font-style: italic; margin-top: 4px; }
        #progress { position: absolute; bottom: 0; left: 0; height: 4px; background: #ff0000; width: 0%; }
        #broadcast-wrapper.active #progress { animation: countdown 7s linear forwards; }
        @keyframes countdown { from { width: 100%; } to { width: 0%; } }
    </style>
</head>
<body>
    <div id="broadcast-wrapper">
        <div id="main-bar">
            <div id="accent-stripe"></div>
            <div id="content-layer">
                <div id="time" class="time-box">0'</div>
                <div class="main-info">
                    <div id="label" class="label">EREIGNIS</div>
                    <div id="player" class="player-name">-</div>
                    <div id="sub" class="sub-text">-</div>
                </div>
            </div>
            <div id="progress"></div>
        </div>
    </div>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM", authDomain: "obs-overlay-2950c.firebaseapp.com", databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/", projectId: "obs-overlay-2950c", storageBucket: "obs-overlay-2950c.firebasestorage.app", messagingSenderId: "1094353952185", appId: "1:1094353952185:web:da70794c9e5104fda22a68" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        const wrapper = document.getElementById('broadcast-wrapper');
        let lastTs = 0;
        db.ref('triggered_event').on('value', snap => {
            const val = snap.val(); if(!val || val.timestamp <= lastTs) return; lastTs = val.timestamp;
            const ev = val.data; const isGoal = ev.type === 'goal';
            
            // Dynamisches Label (z.B. "2 MIN ZEITSTRAFE")
            document.getElementById('label').innerText = ev.label;
            document.getElementById('label').style.color = isGoal ? "#ff0000" : "#ffffff";
            document.getElementById('accent-stripe').style.background = isGoal ? "#ff0000" : "#ffffff";
            document.getElementById('progress').style.background = isGoal ? "#ff0000" : "#ffffff";
            document.getElementById('time').innerText = ev.time;
            document.getElementById('time').style.color = isGoal ? "#ff0000" : "#ffffff";
            document.getElementById('player').innerText = ev.player;
            document.getElementById('sub').innerText = ev.detail;

            wrapper.classList.remove('active'); void wrapper.offsetWidth; wrapper.classList.add('active');
            setTimeout(() => wrapper.classList.remove('active'), 7000);
        });
    </script>
</body>
</html>
