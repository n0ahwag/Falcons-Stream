<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Floorball Auto-Regie Professional</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f0f11; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .back-btn { color: #888; text-decoration: none; font-size: 13px; border: 1px solid #333; padding: 8px 15px; border-radius: 8px; transition: 0.3s; }
        .back-btn:hover { border-color: #ff0000; color: #ff0000; }

        .config-card { background: #18181b; padding: 20px; border-radius: 12px; width: 100%; max-width: 560px; border: 1px solid #2d2d30; margin-bottom: 30px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input { flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #09090b; color: white; outline: none; font-size: 16px; }
        button { background: #ff0000; border: none; color: white; border-radius: 8px; padding: 0 20px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        button:disabled { background: #333; color: #666; }

        .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #666; padding: 10px; background: #09090b; border-radius: 6px; }

        /* Timeline */
        .timeline { width: 100%; max-width: 600px; }
        .period-header { font-size: 11px; text-transform: uppercase; color: #ff0000; letter-spacing: 2px; margin: 30px 0 15px 0; font-weight: 800; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .event-card { 
            background: #18181b; margin-bottom: 10px; padding: 15px 20px; border-radius: 10px; 
            display: flex; align-items: center; cursor: pointer; border: 1px solid #2d2d30;
            transition: all 0.2s ease; border-left: 5px solid #444;
        }
        .event-card:hover { transform: scale(1.01); background: #222226; border-color: #ff0000; }
        .event-card.goal { border-left-color: #ff0000; }
        .event-card.penalty { border-left-color: #ffffff; }

        .ev-time { font-weight: 900; color: #ff0000; width: 45px; font-size: 18px; }
        .penalty .ev-time { color: white; }
        .ev-info { flex-grow: 1; padding-left: 15px; }
        .ev-player { font-weight: 700; font-size: 16px; display: block; text-transform: uppercase; }
        .ev-detail { font-size: 12px; color: #888; font-style: italic; }
        .ev-trigger { opacity: 0.3; font-size: 18px; }
        .event-card:hover .ev-trigger { opacity: 1; }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="font-size:18px; margin:0; letter-spacing:1px;">🤖 AUTO-REGIE</h1>
        <a href="admin.html" class="back-btn">← ZURÜCK</a>
    </div>

    <div class="config-card">
        <div class="input-group">
            <input type="text" id="gameId" placeholder="Spiel-ID (5-stellig)">
            <button id="loadBtn" onclick="manualSync()">ID LADEN</button>
        </div>
        <div class="status-bar">
            <span>Status: <b id="sync-status">Bereit</b></span>
            <label><input type="checkbox" id="autoToggle"> Auto-Mode</label>
        </div>
    </div>

    <div class="timeline" id="timeline"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activeId = "";
        let playersDB = null;
        let lastEventCount = 0;

        // Firebase Listeners
        db.ref('auto_settings').on('value', snap => {
            const val = snap.val() || {};
            activeId = val.gameId || "";
            document.getElementById('gameId').value = activeId;
            document.getElementById('autoToggle').checked = val.autoMode || false;
            if(activeId) fetchTimeline();
        });

        async function manualSync() {
            activeId = document.getElementById('gameId').value;
            if(activeId.length !== 5) return alert("ID muss 5-stellig sein.");
            document.getElementById('loadBtn').disabled = true;
            document.getElementById('loadBtn').innerText = "LÄDT...";
            await db.ref('auto_settings/gameId').set(activeId);
            await fetchTimeline();
            document.getElementById('loadBtn').disabled = false;
            document.getElementById('loadBtn').innerText = "ID LADEN";
        }

        async function fetchTimeline() {
            if(!activeId) return;
            try {
                // Wir nutzen corsproxy.io um CORS Probleme zu vermeiden
                const url = `https://corsproxy.io/?https://saisonmanager.de/api/v2/games/${activeId}.json`;
                const response = await fetch(url);
                const data = await response.json();
                
                playersDB = data.players;
                const events = data.events;

                renderTimeline(events);
                
                // Automatik Check
                if(document.getElementById('autoToggle').checked) {
                    if(events.length > lastEventCount && lastEventCount !== 0) {
                        const newEvent = events[events.length - 1];
                        triggerOverlay(newEvent);
                    }
                }
                lastEventCount = events.length;
                document.getElementById('sync-status').innerText = "Verbunden (" + new Date().toLocaleTimeString() + ")";
            } catch (e) {
                document.getElementById('sync-status').innerText = "Fehler!";
                console.error(e);
            }
        }

        function renderTimeline(events) {
            const container = document.getElementById('timeline');
            container.innerHTML = "";
            let lastPeriod = 0;

            // Ereignisse umdrehen, damit die neuesten oben stehen
            const reversedEvents = [...events].reverse();

            reversedEvents.forEach(ev => {
                if (ev.event_type !== 'goal' && ev.event_type !== 'penalty') return;

                const teamPlayers = playersDB[ev.event_team];
                let pName = "Unbekannt", detail = "";

                // Spieler Namen finden
                const pObj = teamPlayers.find(p => p.trikot_number == ev.number);
                if(pObj) pName = `${pObj.player_firstname} ${pObj.player_name}`;

                if(ev.event_type === 'goal') {
                    if(ev.assist) {
                        const aObj = teamPlayers.find(p => p.trikot_number == ev.assist);
                        if(aObj) detail = `Assist: ${aObj.player_name}`;
                    } else { detail = "Einzelleistung"; }
                } else {
                    detail = `${ev.penalty_type_string} (${ev.duration} Min)`;
                }

                // Perioden Header
                if(ev.period !== lastPeriod) {
                    const h = document.createElement('div');
                    h.className = 'period-header';
                    h.innerText = ev.period + ". Periode";
                    container.appendChild(h);
                }

                const card = document.createElement('div');
                card.className = `event-card ${ev.event_type}`;
                card.innerHTML = `
                    <div class="ev-time">${ev.time}</div>
                    <div class="ev-info">
                        <span class="ev-player">${pName}</span>
                        <span class="ev-sub">${detail}</span>
                    </div>
                    <div class="ev-trigger">🚀</div>
                `;
                
                // Beim Klick das Overlay triggern
                card.onclick = () => {
                    const triggerData = {
                        type: ev.event_type,
                        time: ev.time,
                        player: pName,
                        detail: detail
                    };
                    db.ref('triggered_event').set({
                        data: triggerData,
                        timestamp: Date.now()
                    });
                };
                
                container.appendChild(card);
            });
        }

        setInterval(fetchTimeline, 10000); // Alle 10 Sek
    </script>
</body>
</html>
