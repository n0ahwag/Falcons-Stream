<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Auto-Sync & Timeline Control</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #121212; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { color: #888; text-decoration: none; font-size: 14px; border: 1px solid #333; padding: 8px 15px; border-radius: 8px; }

        .config-card { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 100%; max-width: 560px; border: 1px solid #333; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input { flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #252525; color: white; outline: none; }
        
        /* Button Zustände */
        #loadBtn { 
            background: #ff0000; border: none; color: white; border-radius: 8px; 
            padding: 0 20px; font-weight: bold; cursor: pointer; transition: 0.3s;
            min-width: 120px;
        }
        #loadBtn:disabled { 
            background: #444 !important; 
            color: #888 !important; 
            cursor: not-allowed; 
            opacity: 0.7; 
        }

        .mode-box { display: flex; align-items: center; justify-content: space-between; background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #444; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #ff0000; }
        input:checked + .slider:before { transform: translateX(24px); }

        .timeline { width: 100%; max-width: 600px; }
        .event-item { background: #1e1e1e; margin-bottom: 8px; padding: 12px 20px; border-radius: 10px; display: flex; align-items: center; cursor: pointer; border-left: 5px solid transparent; transition: 0.2s; border: 1px solid #333; }
        .event-item:hover { transform: scale(1.01); background: #252525; }
        .event-item.goal { border-left-color: #ff0000; }
        .event-item.penalty { border-left-color: #ffffff; }
        .event-time { font-weight: 800; color: #ff0000; width: 60px; font-size: 14px; }
        .event-info { flex-grow: 1; }
        .event-player { font-weight: 600; font-size: 16px; display: block; }
        .event-detail { font-size: 12px; color: #888; }
        
        #sync-status { font-size: 12px; color: #666; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🤖 Auto-Sync Control</h1>
        <a href="admin.html" class="back-btn">← Admin</a>
    </div>

    <div class="config-card">
        <div class="input-group">
            <input type="number" id="gameId" placeholder="ID (z.B. 43426)">
            <button id="loadBtn" onclick="updateGameId()">ID LADEN</button>
        </div>
        
        <div class="mode-box">
            <span><b>Vollautomatischer Modus</b></span>
            <label class="switch">
                <input type="checkbox" id="autoToggle" onchange="toggleAutoMode()">
                <span class="slider"></span>
            </label>
        </div>
        <div id="sync-status">Bereit.</div>
    </div>

    <div class="timeline" id="timeline"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activeId = "";
        let autoMode = false;
        let lastEventId = null;

        // Liste der Proxies für Fallback
        const proxies = [
            (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
            (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
        ];

        db.ref('auto_settings').on('value', snap => {
            const val = snap.val() || {};
            activeId = val.gameId || "";
            autoMode = val.autoMode || false;
            document.getElementById('gameId').value = activeId;
            document.getElementById('autoToggle').checked = autoMode;
            if(activeId && !lastEventId) fetchTimeline();
        });

        async function updateGameId() {
            const id = document.getElementById('gameId').value;
            if(!id) return alert("Bitte ID eingeben!");
            
            setLoading(true);
            await db.ref('auto_settings/gameId').set(id);
            lastEventId = null; 
            await fetchTimeline();
            setLoading(false);
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('loadBtn');
            const status = document.getElementById('sync-status');
            if(isLoading) {
                btn.disabled = true;
                btn.innerText = "LADE...";
                status.innerText = "Verbindung zum Saisonmanager wird aufgebaut...";
                status.style.color = "#888";
            } else {
                btn.disabled = false;
                btn.innerText = "ID LADEN";
            }
        }

        function toggleAutoMode() {
            db.ref('auto_settings/autoMode').set(document.getElementById('autoToggle').checked);
        }

        async function fetchTimeline() {
            if(!activeId) return;
            const status = document.getElementById('sync-status');
            const targetUrl = `https://saisonmanager.de/api/v2/games/${activeId}.json`;
            
            let success = false;
            let data = null;

            // Versuche verschiedene Proxies nacheinander
            for (let i = 0; i < proxies.length; i++) {
                try {
                    const response = await fetch(proxies[i](targetUrl));
                    if (response.ok) {
                        data = await response.json();
                        success = true;
                        break; 
                    }
                } catch (e) {
                    console.warn(`Proxy ${i} fehlgeschlagen, versuche nächsten...`);
                }
            }

            if (success && data) {
                const goals = (data.events.goals || []).map(g => ({...g, type: 'goal', sort: g.id}));
                const pens = (data.events.penalties || []).map(p => ({...p, type: 'penalty', sort: p.id}));
                const allEvents = [...goals, ...pens].sort((a,b) => b.sort - a.sort);
                
                renderTimeline(allEvents);
                checkAutoTrigger(allEvents);

                status.innerText = "Letzter Sync: " + new Date().toLocaleTimeString() + " (Stabil)";
                status.style.color = "#00ff00";
            } else {
                status.innerText = "Sync Fehler! Alle Proxies blockiert. ID prüfen oder Seite neu laden.";
                status.style.color = "#ff4444";
            }
            setLoading(false);
        }

        function renderTimeline(events) {
            const container = document.getElementById('timeline');
            container.innerHTML = '<h3 style="margin-bottom:15px; font-size:14px; color:#888; text-transform:uppercase;">Ereignisse</h3>';
            
            if(events.length === 0) { 
                container.innerHTML += '<div style="color:#555; text-align:center; padding:20px;">Noch keine Ereignisse eingetragen.</div>'; 
                return; 
            }

            events.forEach(ev => {
                const div = document.createElement('div');
                div.className = `event-item ${ev.type}`;
                const isGoal = ev.type === 'goal';
                const player = isGoal ? `${ev.scorer.firstname} ${ev.scorer.lastname}` : `${ev.player.firstname} ${ev.player.lastname}`;
                const detail = isGoal ? (ev.assist ? `Assist: ${ev.assist.firstname} ${ev.assist.lastname}` : "Einzelleistung") : `${ev.duration} Min - ${ev.penalty_type}`;
                
                div.innerHTML = `<div class="event-time">${ev.game_time}'</div><div class="event-info"><span class="event-player">${player}</span><span class="event-detail">${detail}</span></div>`;
                div.onclick = () => triggerOverlay(ev);
                container.appendChild(div);
            });
        }

        function checkAutoTrigger(events) {
            if(!autoMode || events.length === 0) {
                if(events.length > 0) lastEventId = events[0].id;
                return;
            }
            const latest = events[0];
            if(lastEventId !== null && latest.id > lastEventId) {
                triggerOverlay(latest);
            }
            lastEventId = latest.id;
        }

        function triggerOverlay(ev) {
            db.ref('triggered_event').set({ data: ev, timestamp: Date.now() });
        }

        // Alle 30 Sekunden im Hintergrund aktualisieren (schont API & Proxy)
        setInterval(fetchTimeline, 30000);
    </script>
</body>
</html>
