<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Auto-Sync - Floorball Control</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #121212; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { color: #888; text-decoration: none; font-size: 14px; border: 1px solid #333; padding: 8px 15px; border-radius: 8px; }

        .config-card { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 100%; max-width: 560px; border: 1px solid #333; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input { flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #252525; color: white; outline: none; font-size: 16px; }
        
        /* Button & Lade-Zustand */
        #loadBtn { 
            background: #ff0000; border: none; color: white; border-radius: 8px; 
            padding: 0 25px; font-weight: 800; cursor: pointer; transition: all 0.2s;
            min-width: 140px; text-transform: uppercase;
        }
        #loadBtn:disabled { 
            background: #333 !important; 
            color: #777 !important; 
            cursor: not-allowed;
            border: 1px solid #444;
        }

        .mode-box { display: flex; align-items: center; justify-content: space-between; background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #444; }
        
        /* Timeline */
        .timeline { width: 100%; max-width: 600px; margin-top: 20px; }
        .event-item { background: #1e1e1e; margin-bottom: 10px; padding: 15px 20px; border-radius: 10px; display: flex; align-items: center; cursor: pointer; border: 1px solid #333; transition: 0.2s; }
        .event-item:hover { background: #252525; border-color: #ff0000; transform: translateY(-2px); }
        .event-item.goal { border-left: 6px solid #ff0000; }
        .event-item.penalty { border-left: 6px solid #ffffff; }
        .event-time { font-weight: 800; color: #ff0000; width: 50px; font-size: 16px; }
        .penalty .event-time { color: white; }
        .event-info { flex-grow: 1; padding-left: 10px; }
        .event-player { font-weight: 700; font-size: 16px; display: block; text-transform: uppercase; }
        .event-detail { font-size: 12px; color: #aaa; }
        
        #sync-status { font-size: 12px; color: #666; margin-top: 15px; text-align: center; font-weight: bold; }
        .loader { display: none; margin-left: 10px; border: 3px solid #333; border-top: 3px solid #ff0000; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>🤖 Auto-Regie</h1>
        <a href="admin.html" class="back-btn">← Zurück</a>
    </div>

    <div class="config-card">
        <div class="input-group">
            <input type="number" id="gameId" placeholder="Spiel-ID eingeben...">
            <button id="loadBtn" onclick="updateGameId()">ID Laden</button>
        </div>
        
        <div class="mode-box">
            <span><b>Vollautomatik</b><br><small style="color:#888">Overlay zeigt Tore sofort automatisch</small></span>
            <input type="checkbox" id="autoToggle" onchange="toggleAutoMode()" style="width: 25px; height: 25px; cursor: pointer;">
        </div>
        <div id="sync-status">Bereit.</div>
    </div>

    <div class="timeline" id="timeline"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activeId = "";
        let autoMode = false;
        let lastEventId = null;

        // Firebase Sync
        db.ref('auto_settings').on('value', snap => {
            const val = snap.val() || {};
            activeId = val.gameId || "";
            autoMode = val.autoMode || false;
            document.getElementById('gameId').value = activeId;
            document.getElementById('autoToggle').checked = autoMode;
            if(activeId && !lastEventId) fetchTimeline();
        });

        async function updateGameId() {
            const id = document.getElementById('gameId').value;
            if(!id || id.length < 3) return alert("Bitte gültige ID eingeben!");
            
            setBtnState(true, "LÄDT...");
            await db.ref('auto_settings/gameId').set(id);
            lastEventId = null; 
            await fetchTimeline();
            setBtnState(false, "ID LADEN");
        }

        function setBtnState(loading, text) {
            const btn = document.getElementById('loadBtn');
            btn.disabled = loading;
            btn.innerText = text;
        }

        function toggleAutoMode() {
            db.ref('auto_settings/autoMode').set(document.getElementById('autoToggle').checked);
        }

        // --- DER TRIPLE-PROXY-FETCH ---
        async function fetchTimeline() {
            if(!activeId) return;
            const status = document.getElementById('sync-status');
            const targetUrl = `https://saisonmanager.de/api/v2/games/${activeId}.json`;
            
            // Drei verschiedene Proxy-Wege
            const proxyPaths = [
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
                `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}&t=${Date.now()}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
            ];

            let data = null;
            let success = false;

            status.innerText = "Versuche Verbindung zum Saisonmanager...";

            for (let path of proxyPaths) {
                try {
                    const response = await fetch(path, { method: 'GET' });
                    if (!response.ok) continue;

                    let result = await response.json();
                    
                    // Fallback für AllOrigins Wrapper-Format
                    if (result.contents) {
                        data = JSON.parse(result.contents);
                    } else {
                        data = result;
                    }

                    if (data && data.events) {
                        success = true;
                        break;
                    }
                } catch (e) {
                    console.warn("Ein Proxy-Weg ist fehlgeschlagen, versuche nächsten...");
                }
            }

            if (success) {
                const goals = (data.events.goals || []).map(g => ({...g, type: 'goal', sort: g.id}));
                const pens = (data.events.penalties || []).map(p => ({...p, type: 'penalty', sort: p.id}));
                const allEvents = [...goals, ...pens].sort((a,b) => b.sort - a.sort);
                
                renderTimeline(allEvents);
                checkAutoTrigger(allEvents);

                status.innerText = "Sync OK: " + new Date().toLocaleTimeString();
                status.style.color = "#00ff00";
            } else {
                status.innerText = "FEHLER: Saisonmanager blockiert alle Verbindungen. Bitte ID prüfen!";
                status.style.color = "#ff4444";
            }
            setBtnState(false, "ID LADEN");
        }

        function renderTimeline(events) {
            const container = document.getElementById('timeline');
            container.innerHTML = '<h3 style="margin-bottom:15px; font-size:12px; color:#555; text-transform:uppercase;">Timeline (Klick zum Triggern)</h3>';
            
            if(events.length === 0) { 
                container.innerHTML += '<div style="color:#444; text-align:center;">Noch keine Tore/Strafen im Saisonmanager.</div>'; 
                return; 
            }

            events.forEach(ev => {
                const div = document.createElement('div');
                div.className = `event-item ${ev.type}`;
                const isGoal = ev.type === 'goal';
                const player = isGoal ? `${ev.scorer.firstname} ${ev.scorer.lastname}` : `${ev.player.firstname} ${ev.player.lastname}`;
                const detail = isGoal ? (ev.assist ? `Assist: ${ev.assist.firstname} ${ev.assist.lastname}` : "Einzelleistung") : `${ev.duration} Min - ${ev.penalty_type}`;
                
                div.innerHTML = `<div class="event-time">${ev.game_time}'</div><div class="event-info"><span class="event-player">${player}</span><span class="event-detail">${detail}</span></div>`;
                div.onclick = () => triggerOverlay(ev);
                container.appendChild(div);
            });
        }

        function checkAutoTrigger(events) {
            if(!autoMode || events.length === 0) {
                if(events.length > 0) lastEventId = events[0].id;
                return;
            }
            const latest = events[0];
            if(lastEventId !== null && latest.id > lastEventId) {
                triggerOverlay(latest);
            }
            lastEventId = latest.id;
        }

        function triggerOverlay(ev) {
            db.ref('triggered_event').set({ data: ev, timestamp: Date.now() });
        }

        // Sync alle 20 Sekunden
        setInterval(fetchTimeline, 20000);
    </script>
</body>
</html>
