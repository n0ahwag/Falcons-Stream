        const db = firebase.database();

        let activeId = "";

        db.ref('auto_settings').on('value', snap => {
            const val = snap.val() || {};
            activeId = val.gameId || "";
            autoMode = val.autoMode || false;
            document.getElementById('gameId').value = activeId;
            document.getElementById('autoToggle').checked = autoMode;
            document.getElementById('autoToggle').checked = val.autoMode || false;

        function updateGameId() {
            const id = document.getElementById('gameId').value;
            if(id.length !== 5) return alert("Bitte eine gültige Spiel-ID eingeben!");
            db.ref('auto_settings/gameId').set(id);
            // Reset Länge damit neue Events vom neuen Spiel getrackt werden
            lastLength = 0;

        function toggleAutoMode() {

        async function manualSync() {
            activeId = document.getElementById('gameId').value;
            if(activeId.length !== 5) return alert("ID muss 5-stellig sein.");
            document.getElementById('loadBtn').disabled = true;
            document.getElementById('loadBtn').innerText = "LÄDT...";
            await db.ref('auto_settings/gameId').set(activeId);
            await fetchTimeline();
            document.getElementById('loadBtn').disabled = false;
            document.getElementById('loadBtn').innerText = "ID LADEN";

        async function fetchTimeline() {
            if(!activeId) return;
            const status = document.getElementById('sync-status');
            
            try {
                const url = `https://saisonmanager.de/api/v2/games/${activeId}.json`;

                let response = null;
                for (let i = 0; i < 3; i++) {
                    response = await fetch(url);
                    if (response.ok) break;
                }

                // Wir nutzen corsproxy.io um CORS Probleme zu vermeiden
                const url = `https://corsproxy.io/?https://saisonmanager.de/api/v2/games/${activeId}.json`;
                const response = await fetch(url);
                const data = await response.json();
                players = data.players;

                renderTimeline(data.events);
                checkAutoTrigger(data.events);
                
                playersDB = data.players;
                const events = data.events;

                document.getElementById('sync-status').innerText = "Letzter Sync: " + new Date().toLocaleTimeString();
                status.innerText = "Letzter Sync: " + new Date().toLocaleTimeString();
                status.style.color = "#00ff00";
                renderTimeline(events);
                
                // Automatik Check
                if(document.getElementById('autoToggle').checked) {
                    if(events.length > lastEventCount && lastEventCount !== 0) {
                        const newEvent = events[events.length - 1];
                        triggerOverlay(newEvent);
                    }
                }
                lastEventCount = events.length;
                document.getElementById('sync-status').innerText = "Verbunden (" + new Date().toLocaleTimeString() + ")";
            } catch (e) {
                document.getElementById('sync-status').innerText = "Sync Fehler!";
                console.error("Sync Error:", e);
                status.innerText = "Sync Fehler! (Eventuell falsche ID?)";
                status.style.color = "#ff4444";
                document.getElementById('sync-status').innerText = "Fehler!";
                console.error(e);
            }
        }

        function renderTimeline(events) {
            const container = document.getElementById('timeline');
            container.innerHTML = '<h3 style="margin-bottom:15px">Ereignisse des Spiels</h3>';
            if(events.length === 0) { container.innerHTML += '<div style="color:#555">Noch keine Ereignisse eingetragen.</div>'; return; }

            container.innerHTML = "";
            let lastPeriod = 0;

            events.forEach(ev => {
                const div = document.createElement('div');
                div.className = `event-item ${ev.event_type}`;
                
                const isGoal = ev.event_type == 'goal';
                const isPenalty = ev.event_type == 'penalty';
                if (isGoal || isPenalty) {
                    const teamPlayers = players[ev.event_team];
                    let detail = "", playerText = "";

                    for (const i in teamPlayers) {
                        const player = teamPlayers[i]
                        if (player.trikot_number == ev.number) {
                            playerText = `${player.player_firstname} ${player.player_name}`;
                            break;
                        }
                    }
            // Ereignisse umdrehen, damit die neuesten oben stehen
            const reversedEvents = [...events].reverse();

                    if (isPenalty) {
                        detail = `${ev.penalty_type_string} - ${ev.penalty_reason_string}`;
                    }
                    else if (ev.assist) {
                        for (const i in teamPlayers) {
                            const player = teamPlayers[i]
                            if (player.trikot_number == ev.assist) {
                                detail = `${player.player_firstname} ${player.player_name}`;
                                break;
                            }
                        }
                    }
            reversedEvents.forEach(ev => {
                if (ev.event_type !== 'goal' && ev.event_type !== 'penalty') return;

                    div.innerHTML = `
                        <div class="event-time">${ev.time}</div>
                        <div class="event-info">
                            <span class="event-player">${playerText}</span>
                            <span class="event-detail">${detail}</span>
                        </div>
                    `;

                    //div.onclick = () => triggerOverlay(ev);
                    for (let i = lastPeriod+1; i <= ev.period; i++) {
                        const div2 = document.createElement('div');
                        div2.innerHTML = `
                            <span>${i}. Periode</span>
                        `
                        container.appendChild(div2);
                    }
                    container.appendChild(div);
                    
                    lastPeriod = ev.period;
                }
            });
        }
                const teamPlayers = playersDB[ev.event_team];
                let pName = "Unbekannt", detail = "";

        function checkAutoTrigger(events) {
            if (autoMode) {
                for (let i = lastLength; i < events.length; i++) {
                    //triggerOverlay(events[i]);
                // Spieler Namen finden
                const pObj = teamPlayers.find(p => p.trikot_number == ev.number);
                if(pObj) pName = `${pObj.player_firstname} ${pObj.player_name}`;

                if(ev.event_type === 'goal') {
                    if(ev.assist) {
                        const aObj = teamPlayers.find(p => p.trikot_number == ev.assist);
                        if(aObj) detail = `Assist: ${aObj.player_name}`;
                    } else { detail = "Einzelleistung"; }
                } else {
                    detail = `${ev.penalty_type_string} (${ev.duration} Min)`;
                }
            }

            lastLength = events.length;
        }
                // Perioden Header
                if(ev.period !== lastPeriod) {
                    const h = document.createElement('div');
                    h.className = 'period-header';
                    h.innerText = ev.period + ". Periode";
                    container.appendChild(h);
                }

        function triggerOverlay(ev) {
            db.ref('triggered_event').set({
                data: ev,
                timestamp: Date.now()
                const card = document.createElement('div');
                card.className = `event-card ${ev.event_type}`;
                card.innerHTML = `
                    <div class="ev-time">${ev.time}</div>
                    <div class="ev-info">
                        <span class="ev-player">${pName}</span>
                        <span class="ev-sub">${detail}</span>
                    </div>
                    <div class="ev-trigger">🚀</div>
                `;
                
                // Beim Klick das Overlay triggern
                card.onclick = () => {
                    const triggerData = {
                        type: ev.event_type,
                        time: ev.time,
                        player: pName,
                        detail: detail
                    };
                    db.ref('triggered_event').set({
                        data: triggerData,
                        timestamp: Date.now()
                    });
                };
                
                container.appendChild(card);
            });
        }
