<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Auto-Regie Director</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0c0c0d; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #16161a; padding: 20px; border-radius: 12px; border: 1px solid #2d2d33; width: 100%; max-width: 500px; margin-bottom: 20px; }
        h2 { font-size: 12px; text-transform: uppercase; color: #ff0000; letter-spacing: 2px; margin-bottom: 15px; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"], input[type="number"] { flex: 1; background: #000; border: 1px solid #333; padding: 12px; color: white; border-radius: 8px; }
        
        /* Color Picker Styles */
        .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .color-item { display: flex; flex-direction: column; gap: 5px; }
        input[type="color"] { width: 100%; height: 40px; border: none; background: none; cursor: pointer; }

        .event-btn { 
            background: #1c1c22; border: 1px solid #333; padding: 15px; border-radius: 10px; 
            margin-bottom: 10px; display: flex; align-items: center; cursor: pointer; transition: 0.2s;
            border-left: 5px solid #444; width: 100%; text-align: left; color: white;
        }
        .event-btn:hover { border-color: #ff0000; transform: translateX(5px); }
        .event-btn.goal { border-left-color: #ff0000; }
        .event-btn.penalty { border-left-color: #fff; }
        .ev-time { font-weight: 900; color: #ff0000; width: 40px; }
        .ev-info { flex: 1; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Design & Farben</h2>
        <div class="color-grid">
            <div class="color-item">
                <label style="font-size: 10px;">Hauptfarbe (z.B. Team Rot)</label>
                <input type="color" id="colorPrimary" value="#ff0000" onchange="saveColors()">
            </div>
            <div class="color-item">
                <label style="font-size: 10px;">Akzentfarbe (Schrift links)</label>
                <input type="color" id="colorAccent" value="#ffffff" onchange="saveColors()">
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Spiel-Verbindung</h2>
        <div class="input-group">
            <input type="number" id="gameId" placeholder="Spiel-ID (z.B. 43426)">
            <button onclick="loadGame()" style="background:#ff0000; border:none; color:white; padding:0 20px; border-radius:8px; font-weight:bold; cursor:pointer;">Laden</button>
        </div>
    </div>

    <div id="timeline" style="width: 100%; max-width: 540px;"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Sync Colors from DB
        db.ref('auto_settings/colors').on('value', snap => {
            const c = snap.val();
            if(c) {
                document.getElementById('colorPrimary').value = c.primary;
                document.getElementById('colorAccent').value = c.accent;
            }
        });

        function saveColors() {
            db.ref('auto_settings/colors').set({
                primary: document.getElementById('colorPrimary').value,
                accent: document.getElementById('colorAccent').value
            });
        }

        async function loadGame() {
            const id = document.getElementById('gameId').value;
            const url = `https://corsproxy.io/?https://saisonmanager.de/api/v2/games/${id}.json`;
            const res = await fetch(url);
            const data = await res.json();
            render(data);
        }

        function render(data) {
            const container = document.getElementById('timeline');
            container.innerHTML = "";
            const players = data.players;
            const events = [...data.events.reverse()];
            
            events.forEach(ev => {
                if(ev.event_type !== 'goal' && ev.event_type !== 'penalty') return;
                const isG = ev.event_type === 'goal';
                const teamP = players[ev.event_team];
                const p = teamP.find(x => x.trikot_number == ev.number);
                const name = p ? p.player_firstname + " " + p.player_name : "Unbekannt";
                
                const btn = document.createElement('button');
                btn.className = `event-btn ${ev.event_type}`;
                btn.innerHTML = `<span class="ev-time">${ev.time}</span><div class="ev-info"><b>${name}</b><br><small>${isG ? 'Tor' : ev.penalty_type_string}</small></div>`;
                
                btn.onclick = () => {
                    db.ref('triggered_event').set({
                        timestamp: Date.now(),
                        data: {
                            type: ev.event_type,
                            player: name,
                            time: ev.time + "'",
                            detail: isG ? (ev.assist ? "Assist: " + ev.assist : "Einzelleistung") : ev.penalty_type_string
                        }
                    });
                };
                container.appendChild(btn);
            });
        }
    </script>
</body>
</html>
