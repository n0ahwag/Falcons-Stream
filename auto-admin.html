<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Auto-Sync Regie Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0c0c0d; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #16161a; padding: 20px; border-radius: 12px; border: 1px solid #333; width: 100%; max-width: 550px; margin-bottom: 20px; }
        .team-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .team-card { background: #222; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #444; }
        .team-card b { display: block; font-size: 14px; margin-bottom: 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        
        button { padding: 10px; border-radius: 6px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        .btn-lineup { width: 100%; background: #444; color: white; margin-bottom: 5px; }
        .btn-lineup:hover { background: #ff0000; }
        
        input[type="color"] { width: 100%; height: 30px; border: none; background: none; cursor: pointer; }
        input[type="number"] { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: white; border-radius: 8px; margin-bottom: 10px; }
        #status { font-size: 11px; color: #666; text-align: center; }
        
        .timeline-item { background: #1a1a1f; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; border-left: 5px solid #444; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <div style="display:flex; gap:10px;">
            <input type="number" id="gameId" placeholder="Spiel-ID (z.B. 43426)">
            <button onclick="loadGame()" style="background:#ff0000; color:white; padding:0 20px;">Laden</button>
        </div>
        <div id="status">Bereit.</div>
    </div>

    <div class="card" id="lineup-controls" style="display:none;">
        <div class="team-row">
            <div class="team-card">
                <b id="hName">Heim</b>
                <input type="color" id="colorH" value="#ff0000">
                <button class="btn-lineup" onclick="showLineup('home')">Starting 6 zeigen</button>
            </div>
            <div class="team-card">
                <b id="gName">Gast</b>
                <input type="color" id="colorG" value="#0055ff">
                <button class="btn-lineup" onclick="showLineup('guest')">Starting 6 zeigen</button>
            </div>
        </div>
        <button onclick="hideLineup()" style="width:100%; background:#000; color:#555; border:1px solid #333;">Aufstellung ausblenden</button>
    </div>

    <div id="timeline" style="width:100%; max-width:550px;"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let apiData = null;
        let scoreStr = "0:0";

        db.ref('scoreboard_active').on('value', s => {
            const d = s.val() || {scoreA:0, scoreB:0};
            scoreStr = `${d.scoreA}:${d.scoreB}`;
        });

        async function loadGame() {
            const id = document.getElementById('gameId').value;
            const url = `https://corsproxy.io/?https://saisonmanager.de/api/v2/games/${id}.json`;
            const res = await fetch(url);
            apiData = await res.json();
            
            document.getElementById('hName').innerText = apiData.game.home_team.name;
            document.getElementById('gName').innerText = apiData.game.guest_team.name;
            document.getElementById('lineup-controls').style.display = "block";
            document.getElementById('status').innerText = "Spiel geladen!";
            renderTimeline();
        }

        function showLineup(side) {
            const team = side === 'home' ? apiData.game.home_team : apiData.game.guest_team;
            const color = document.getElementById(side === 'home' ? 'colorH' : 'colorG').value;
            
            // Suche die "Starting Six" (Spieler mit is_starting: true)
            const allPlayers = apiData.players[team.id];
            const starting = allPlayers.filter(p => p.is_starting).sort((a,b) => a.role_id - b.role_id);
            
            const playersFormatted = starting.map(p => ({
                nr: p.trikot_number,
                name: p.player_firstname + " " + p.player_name
            }));

            db.ref('auto_lineup_trigger').set({
                visible: true,
                teamName: team.name,
                color: color,
                score: scoreStr,
                players: playersFormatted,
                timestamp: Date.now()
            });
        }

        function hideLineup() { db.ref('auto_lineup_trigger/visible').set(false); }

        function renderTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = "";
            const events = [...apiData.events].reverse();
            events.forEach(ev => {
                if(ev.event_type !== 'goal' && ev.event_type !== 'penalty') return;
                const div = document.createElement('div');
                div.className = "timeline-item";
                div.innerHTML = `<b>${ev.time}'</b> - ${ev.event_type.toUpperCase()}`;
                div.onclick = () => {
                    // Hier Trigger für Goal-Overlay einfügen (wie bisher)
                };
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
