<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineup Control - Pro Broadcast</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background: #0c0c0e; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* Navigation */
        .nav { width: 100%; max-width: 600px; display: flex; justify-content: space-between; margin-bottom: 20px; }
        .nav a { color: #888; text-decoration: none; font-size: 12px; border: 1px solid #333; padding: 8px 15px; border-radius: 6px; text-transform: uppercase; font-weight: 600; }
        .nav a:hover { color: #ff0000; border-color: #ff0000; }

        h1 { color: #ff0000; text-transform: uppercase; font-size: 18px; letter-spacing: 3px; margin-bottom: 30px; }

        /* Team & Auto-Cycle */
        .top-controls { width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; }
        
        select.team-select { 
            width: 100%; padding: 15px; background: #ff0000; border: none; 
            border-radius: 10px; color: white; font-weight: 800; font-size: 16px; 
            cursor: pointer; font-family: inherit;
        }

        .auto-btn { 
            background: #222; color: #fff; border: 1px solid #444; padding: 15px; 
            border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; 
            transition: all 0.3s;
        }
        .auto-btn:hover:not(:disabled) { background: #ff0000; border-color: #ff0000; }
        .auto-btn:disabled { opacity: 0.5; cursor: wait; }

        /* Reihen Sektionen */
        .line-card { 
            background: #16161a; padding: 25px; border-radius: 15px; 
            width: 100%; max-width: 500px; margin-bottom: 40px; border: 1px solid #2d2d35; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        h2 { text-align: center; color: #eee; font-size: 14px; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 2px; }

        /* Taktik Grid 2-1-2 */
        .pitch { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .pitch-row { display: flex; gap: 15px; justify-content: center; width: 100%; }

        .player-input { background: #252528; padding: 8px; border-radius: 8px; width: 140px; border: 1px solid #333; transition: 0.2s; }
        .player-input:focus-within { border-color: #ff0000; background: #2a2a30; }
        .player-input label { font-size: 9px; color: #ff0000; font-weight: 800; display: block; text-transform: uppercase; margin-bottom: 4px; }
        .player-input div { display: flex; align-items: center; gap: 8px; }
        .player-input input { width: 45px; background: transparent; border: none; color: white; font-size: 14px; font-weight: 800; border-bottom: 1px solid #444; outline: none; }
        .player-input span { font-size: 11px; color: #aaa; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }

        .card-actions { display: flex; gap: 10px; margin-top: 25px; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 11px; transition: 0.2s; }
        .btn-save { background: #28a745; color: white; }
        .btn-show { background: #ff0000; color: white; }
        .btn-hide { background: #333; color: #888; }
        .btn:active { transform: scale(0.96); }

        #toast { position: fixed; bottom: 20px; background: #28a745; color: white; padding: 10px 25px; border-radius: 50px; font-weight: bold; display: none; z-index: 1000; }
    </style>
</head>
<body>

    <div class="nav">
        <a href="admin.html">← Events</a>
        <a href="management.html">Spielerliste</a>
    </div>

    <h1>Aufstellungs-Regie</h1>

    <div class="top-controls">
        <select id="teamSelector" class="team-select" onchange="changeTeam()">
            <option value="2bundesliga">2. Bundesliga</option>
            <option value="regio">Regio</option>
            <option value="u17">U17</option>
            <option value="u15">U15</option>
            <option value="u13">U13</option>
            <option value="u11">U11</option>
            <option value="u9">U9</option>
        </select>
        <button id="cycleBtn" class="auto-btn" onclick="startAutoCycle()">🔄 Auto-Durchlauf starten (Reihe 1-3)</button>
    </div>

    <div id="lines-container">
        <!-- JS generiert hier die 3 Reihen -->
    </div>

    <div id="toast">Gespeichert!</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let players = {};
        let currentTeam = "2bundesliga";
        const positions = ['LW', 'RW', 'C', 'LD', 'RD', 'G'];

        // 1. Initialisierung & Teamwechsel
        function changeTeam() {
            currentTeam = document.getElementById('teamSelector').value;
            // Spieler des Teams laden
            db.ref('teams/' + currentTeam + '/players').on('value', snap => {
                players = snap.val() || {};
                buildUI();
            });
        }

        // 2. UI für 3 Reihen aufbauen
        function buildUI() {
            const container = document.getElementById('lines-container');
            container.innerHTML = '';

            [1, 2, 3].forEach(line => {
                const card = document.createElement('div');
                card.className = 'line-card';
                card.innerHTML = `
                    <h2>${line === 1 ? 'Starting Six (Reihe 1)' : 'Reihe ' + line}</h2>
                    <div class="pitch">
                        <div class="pitch-row">${slot(line, 'LW', 'Sturm L')}${slot(line, 'RW', 'Sturm R')}</div>
                        <div class="pitch-row">${slot(line, 'C', 'Center')}</div>
                        <div class="pitch-row">${slot(line, 'LD', 'Abwehr L')}${slot(line, 'RD', 'Abwehr R')}</div>
                        <div class="pitch-row" style="margin-top:10px">${slot(line, 'G', 'Goalie')}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-save" onclick="saveLine(${line})">Speichern</button>
                        <button class="btn btn-show" onclick="toggleOverlay(${line}, true)">Anzeigen</button>
                        <button class="btn btn-hide" onclick="toggleOverlay(${line}, false)">Aus</button>
                    </div>
                `;
                container.appendChild(card);
                loadExistingLineup(line);
            });
        }

        function slot(line, pos, label) {
            return `
                <div class="player-input">
                    <label>${label}</label>
                    <div>
                        <input type="number" id="nr-${line}-${pos}" placeholder="Nr." oninput="doLookup(${line}, '${pos}')">
                        <span id="name-${line}-${pos}">-</span>
                    </div>
                </div>
            `;
        }

        // 3. Namen automatisch suchen
        function doLookup(line, pos) {
            const nr = document.getElementById(`nr-${line}-${pos}`).value;
            document.getElementById(`name-${line}-${pos}`).innerText = players[nr] || "-";
        }

        // 4. In Firebase speichern
        function saveLine(line) {
            const data = {};
            positions.forEach(pos => {
                data[pos] = document.getElementById(`name-${line}-${pos}`).innerText;
            });
            db.ref('teams/' + currentTeam + '/lineups/' + line).set(data).then(showToast);
        }

        // 5. Gespeicherte Daten laden
        function loadExistingLineup(line) {
            db.ref('teams/' + currentTeam + '/lineups/' + line).once('value', snap => {
                const data = snap.val() || {};
                positions.forEach(pos => {
                    const playerName = data[pos] || "-";
                    document.getElementById(`name-${line}-${pos}`).innerText = playerName;
                    // Nummer rückwärts suchen
                    const nr = Object.keys(players).find(key => players[key] === playerName);
                    if (nr) document.getElementById(`nr-${line}-${pos}`).value = nr;
                });
            });
        }

        // 6. OBS Steuerung
        function toggleOverlay(line, visible) {
            db.ref('lineup_control').set({
                activeLine: line,
                visible: visible,
                team: currentTeam,
                timestamp: Date.now()
            });
        }

        // 7. Auto-Durchlauf
        async function startAutoCycle() {
            const btn = document.getElementById('cycleBtn');
            btn.disabled = true;
            
            for (let i = 1; i <= 3; i++) {
                btn.innerText = `Anzeige: Reihe ${i}...`;
                toggleOverlay(i, true);
                await new Promise(res => setTimeout(res, 8000)); // 7s Anzeige + 1s Puffer
            }
            
            toggleOverlay(1, false);
            btn.disabled = false;
            btn.innerText = "🔄 Auto-Durchlauf starten (Reihe 1-3)";
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.style.display = "block";
            setTimeout(() => t.style.display = "none", 2000);
        }

        // Start
        changeTeam();
    </script>
</body>
</html>
