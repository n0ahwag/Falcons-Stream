<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Elite Starting Six - Auto</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { margin: 0; padding: 0; width: 1920px; height: 1080px; font-family: 'Inter', sans-serif; background: transparent; overflow: hidden; color: white; }

        #lineup-container {
            position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
            width: 1700px; display: flex; flex-direction: column;
            opacity: 0; visibility: hidden; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #lineup-container.active { opacity: 1; visibility: visible; }

        .header-bar {
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px);
            height: 85px; display: flex; align-items: center; padding: 0 40px;
            border-bottom: 3px solid var(--team-color, #ff0000); border-radius: 8px 8px 0 0;
        }
        .team-name { font-size: 34px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        .score-box { margin-left: auto; font-size: 42px; font-weight: 900; background: var(--team-color, #ff0000); padding: 5px 30px; border-radius: 4px; }

        .players-grid {
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px);
            display: grid; grid-template-columns: repeat(6, 1fr); padding: 40px 20px;
        }
        .player-card {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            border-right: 1px solid rgba(255,255,255,0.05); opacity: 0; transform: translateY(30px);
            transition: all 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.28);
        }
        #lineup-container.active .player-card { opacity: 1; transform: translateY(0); }
        .nr { font-size: 65px; font-weight: 900; color: var(--team-color, #ff0000); line-height: 1; margin-bottom: 15px; }
        .name { font-size: 22px; font-weight: 700; text-transform: uppercase; height: 50px; }
        .pos { font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 100px; color: #aaa; text-transform: uppercase; }

        .footer-bar { background: var(--team-color, #ff0000); height: 40px; display: flex; align-items: center; padding: 0 40px; border-radius: 0 0 8px 8px; font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 8px; }

        .delay-1 { transition-delay: 0.3s; } .delay-2 { transition-delay: 0.4s; } .delay-3 { transition-delay: 0.5s; }
        .delay-4 { transition-delay: 0.6s; } .delay-5 { transition-delay: 0.7s; } .delay-6 { transition-delay: 0.8s; }
    </style>
</head>
<body>
    <div id="lineup-container">
        <div class="header-bar">
            <div class="team-name" id="team-name">TEAM NAME</div>
            <div class="score-box" id="score-display">0:0</div>
        </div>
        <div class="players-grid" id="player-grid">
            <!-- 6 Spieler Slots -->
            <div class="player-card delay-1"><div class="nr" id="nr0">--</div><div class="name" id="n0">-</div><div class="pos">Torwart</div></div>
            <div class="player-card delay-2"><div class="nr" id="nr1">--</div><div class="name" id="n1">-</div><div class="pos">Verteidiger</div></div>
            <div class="player-card delay-3"><div class="nr" id="nr2">--</div><div class="name" id="n2">-</div><div class="pos">Verteidiger</div></div>
            <div class="player-card delay-4"><div class="nr" id="nr3">--</div><div class="name" id="n3">-</div><div class="pos">Center</div></div>
            <div class="player-card delay-5"><div class="nr" id="nr4">--</div><div class="name" id="n4">-</div><div class="pos">Stürmer</div></div>
            <div class="player-card delay-6"><div class="nr" id="nr5">--</div><div class="name" id="n5">-</div><div class="pos">Stürmer</div></div>
        </div>
        <div class="footer-bar">Starting Six</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('auto_lineup_trigger').on('value', snap => {
            const val = snap.val();
            if(!val || !val.visible) {
                document.getElementById('lineup-container').classList.remove('active');
                return;
            }
            
            // Farben & Texte setzen
            document.documentElement.style.setProperty('--team-color', val.color);
            document.getElementById('team-name').innerText = val.teamName;
            document.getElementById('score-display').innerText = val.score;

            // Spieler füllen
            val.players.forEach((p, i) => {
                if(i < 6) {
                    document.getElementById('nr'+i).innerText = p.nr;
                    document.getElementById('n'+i).innerText = p.name;
                }
            });

            document.getElementById('lineup-container').classList.add('active');
        });

        // Scoreboard Sync für Live-Updates während Anzeige
        db.ref('scoreboard_active').on('value', snap => {
            const s = snap.val() || {scoreA:0, scoreB:0};
            document.getElementById('score-display').innerText = `${s.scoreA}:${s.scoreB}`;
        });
    </script>
</body>
</html>
