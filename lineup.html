<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Elite Starting Six Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            margin: 0; padding: 0; width: 1920px; height: 1080px; 
            font-family: 'Inter', sans-serif; background: transparent; 
            overflow: hidden; color: white; 
        }

        /* Haupt-Container: Zentriert im unteren Drittel */
        #lineup-container {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 1700px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #lineup-container.active { opacity: 1; visibility: visible; }

        /* HEADER: Team Name & Score */
        .header-bar {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 40px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px 8px 0 0;
        }

        .team-info { flex-grow: 1; }
        .team-name { font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        .match-info { font-size: 12px; font-weight: 700; color: #ff0000; text-transform: uppercase; letter-spacing: 4px; margin-top: -5px; }

        .score-display { 
            font-size: 40px; font-weight: 900; color: white;
            background: #ff0000; padding: 5px 25px; border-radius: 4px;
            letter-spacing: 2px; box-shadow: 0 0 20px rgba(255,0,0,0.3);
        }

        /* MAIN: Spieler Grid */
        .players-grid {
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(20px);
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            padding: 40px 20px;
            gap: 10px;
        }

        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-right: 1px solid rgba(255,255,255,0.05);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.28);
        }
        #lineup-container.active .player-card { opacity: 1; transform: translateY(0); }
        .player-card:last-child { border-right: none; }

        .nr { font-size: 60px; font-weight: 900; color: #ff0000; line-height: 1; margin-bottom: 15px; text-shadow: 2px 2px 0px rgba(0,0,0,0.5); }
        .name { font-size: 20px; font-weight: 700; text-transform: uppercase; line-height: 1.1; height: 44px; margin-bottom: 10px; }
        .pos { font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 100px; color: #aaa; text-transform: uppercase; }

        /* FOOTER: Starting Six Bar */
        .footer-bar {
            background: #ff0000;
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 40px;
            border-radius: 0 0 8px 8px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 8px;
        }

        /* DELAYS für das Nacheinander-Einblenden */
        .delay-1 { transition-delay: 0.3s; }
        .delay-2 { transition-delay: 0.4s; }
        .delay-3 { transition-delay: 0.5s; }
        .delay-4 { transition-delay: 0.6s; }
        .delay-5 { transition-delay: 0.7s; }
        .delay-6 { transition-delay: 0.8s; }
    </style>
</head>
<body>

    <div id="lineup-container">
        <!-- Header -->
        <div class="header-bar">
            <div class="team-info">
                <div id="team-display-name" class="team-name">UHC Sparkasse Weißenfels</div>
                <div class="match-info">Starting Six - 1. Periode</div>
            </div>
            <div id="score-display" class="score-display">0:0</div>
        </div>

        <!-- Players -->
        <div class="players-grid">
            <div class="player-card delay-1">
                <div id="nr-G" class="nr">--</div>
                <div id="p-G" class="name">-</div>
                <div class="pos">Torwart</div>
            </div>
            <div class="player-card delay-2">
                <div id="nr-LD" class="nr">--</div>
                <div id="p-LD" class="name">-</div>
                <div class="pos">Verteidiger</div>
            </div>
            <div class="player-card delay-3">
                <div id="nr-RD" class="nr">--</div>
                <div id="p-RD" class="name">-</div>
                <div class="pos">Verteidiger</div>
            </div>
            <div class="player-card delay-4">
                <div id="nr-C" class="nr">--</div>
                <div id="p-C" class="name">-</div>
                <div class="pos">Center</div>
            </div>
            <div class="player-card delay-5">
                <div id="nr-LW" class="nr">--</div>
                <div id="p-LW" class="name">-</div>
                <div class="pos">Stürmer</div>
            </div>
            <div class="player-card delay-6">
                <div id="nr-RW" class="nr">--</div>
                <div id="p-RW" class="name">-</div>
                <div class="pos">Stürmer</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-bar">
            Starting Six
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const container = document.getElementById('lineup-container');

        // Scoreboard Sync für die Anzeige oben rechts
        db.ref('scoreboard_active').on('value', snap => {
            const s = snap.val() || {scoreA:0, scoreB:0};
            document.getElementById('score-display').innerText = `${s.scoreA}:${s.scoreB}`;
        });

        // Lineup Sync
        db.ref('lineup_control').on('value', snap => {
            const ctrl = snap.val();
            if (ctrl && ctrl.visible && ctrl.activeLine == 1) {
                updateData(ctrl.team || "2bundesliga");
                container.classList.add('active');
            } else {
                container.classList.remove('active');
            }
        });

        function updateData(teamId) {
            // Team Name schön formatieren (z.B. 2bundesliga -> 2. Bundesliga)
            const teamNames = {
                "2bundesliga": "2. Bundesliga Team",
                "u17": "U17 Junioren",
                "u15": "U15 Junioren",
                "u13": "U13 Junioren",
                "regio": "Regionalliga Team"
            };
            document.getElementById('team-display-name').innerText = teamNames[teamId] || teamId.toUpperCase();

            // Spielerdaten laden
            db.ref('teams/' + teamId).once('value', snap => {
                const teamData = snap.val() || {};
                const playersList = teamData.players || {};
                const lineup1 = teamData.lineups ? teamData.lineups[1] : {};

                const positions = ['G', 'LD', 'RD', 'C', 'LW', 'RW'];
                positions.forEach(pos => {
                    const playerName = lineup1[pos] || "-";
                    document.getElementById('p-' + pos).innerText = playerName;
                    
                    // Nummer suchen
                    const nr = Object.keys(playersList).find(key => playersList[key] === playerName);
                    document.getElementById('nr-' + pos).innerText = nr || "";
                });
            });
        }
    </script>
</body>
</html>
