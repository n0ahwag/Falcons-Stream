<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Floorball Elite Lineup</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;900&display=swap');
        
        body { 
            margin: 0; padding: 0; width: 1920px; height: 1080px; 
            font-family: 'Inter', sans-serif; background: transparent; 
            overflow: hidden; color: white; 
        }

        /* Fullscreen Overlay Hintergrund */
        #lineup-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 15, 15, 0.9) 0%, rgba(5, 5, 5, 0.98) 100%);
            backdrop-filter: blur(15px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #lineup-screen.active { opacity: 1; visibility: visible; }

        /* Titel Animation (Masked Slide) */
        .title-container {
            margin-bottom: 70px;
            overflow: hidden;
            text-align: center;
        }
        .title {
            font-size: 70px; font-weight: 900; text-transform: uppercase; 
            letter-spacing: 15px; color: #ff0000;
            transform: translateY(110%); transition: transform 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #lineup-screen.active .title { transform: translateY(0); }

        /* Spielfeld-Aufbau */
        .pitch {
            position: relative;
            width: 1100px; height: 650px;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }

        .row { display: flex; justify-content: center; gap: 140px; width: 100%; }

        /* Spieler Slot Animation */
        .player-slot {
            width: 320px; text-align: center; opacity: 0; transform: translateY(40px) scale(0.9);
            transition: all 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.28);
        }
        #lineup-screen.active .player-slot { opacity: 1; transform: translateY(0) scale(1); }

        .pos-label {
            font-size: 14px; font-weight: 900; color: #ff0000; 
            letter-spacing: 5px; text-transform: uppercase; margin-bottom: 8px;
        }
        .player-name {
            font-size: 30px; font-weight: 500; text-transform: uppercase;
            letter-spacing: -0.5px; padding-bottom: 12px;
            border-bottom: 2px solid rgba(255,255,255,0.15);
            display: inline-block; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Zeitverzögerung für den "Revealing"-Effekt (von hinten nach vorne) */
        .delay-G { transition-delay: 0.4s !important; }
        .delay-D { transition-delay: 0.6s !important; }
        .delay-C { transition-delay: 0.8s !important; }
        .delay-F { transition-delay: 1.0s !important; }

        /* Dezentes Licht-Element am Boden */
        .floor-light {
            position: absolute; bottom: -60px; width: 70%; height: 5px;
            background: radial-gradient(circle, rgba(255,0,0,0.6) 0%, transparent 80%);
            filter: blur(10px); opacity: 0; transition: opacity 1.5s 0.8s;
        }
        #lineup-screen.active .floor-light { opacity: 1; }
    </style>
</head>
<body>

    <div id="lineup-screen">
        <div class="title-container">
            <div id="display-title" class="title">Starting Six</div>
        </div>
        
        <div class="pitch">
            <!-- Sturm (Attack) -->
            <div class="row">
                <div class="player-slot delay-F"><div class="pos-label">LW</div><div id="p-LW" class="player-name">-</div></div>
                <div class="player-slot delay-F"><div class="pos-label">RW</div><div id="p-RW" class="player-name">-</div></div>
            </div>

            <!-- Center -->
            <div class="row">
                <div class="player-slot delay-C"><div class="pos-label">C</div><div id="p-C" class="player-name">-</div></div>
            </div>

            <!-- Verteidigung (Defense) -->
            <div class="row">
                <div class="player-slot delay-D"><div class="pos-label">LD</div><div id="p-LD" class="player-name">-</div></div>
                <div class="player-slot delay-D"><div class="pos-label">RD</div><div id="p-RD" class="player-name">-</div></div>
            </div>

            <!-- Torhüter (Goalie) -->
            <div class="row" style="margin-top: 30px;">
                <div class="player-slot delay-G"><div class="pos-label" style="color:white">Goalie</div><div id="p-G" class="player-name" style="border-color:rgba(255,255,255,0.5)">-</div></div>
            </div>

            <div class="floor-light"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const screen = document.getElementById('lineup-screen');
        const titleEl = document.getElementById('display-title');

        // Überwacht die Steuerung
        db.ref('lineup_control').on('value', (snap) => {
            const ctrl = snap.val();
            if (ctrl && ctrl.visible) {
                // Dynamischer Titel
                titleEl.innerText = (ctrl.activeLine == 1) ? "Starting Six" : ("Reihe " + ctrl.activeLine);
                
                // Daten laden
                updateDisplay(ctrl.team || "2bundesliga", ctrl.activeLine || 1);
                screen.classList.add('active');
            } else {
                screen.classList.remove('active');
            }
        });

        function updateDisplay(team, lineNr) {
            db.ref('teams/' + team + '/lineups/' + lineNr).once('value', (lineSnap) => {
                const data = lineSnap.val() || {};
                const positions = ['LW', 'RW', 'C', 'LD', 'RD', 'G'];
                
                positions.forEach(pos => {
                    const el = document.getElementById('p-' + pos);
                    if (el) {
                        el.innerText = data[pos] || '-';
                    }
                });
            });
        }
    </script>
</body>
</html>
