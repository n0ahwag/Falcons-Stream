<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Floorball Elite Broadcast</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            font-family: 'Inter', sans-serif; background: transparent; 
        }

        /* Hauptcontainer: Positioniert das Overlay 7/8 unten */
        #event-wrapper {
            position: absolute;
            bottom: 12.5%; /* Exakt 7/8 Position */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Wichtig für Masken-Reveal */
        }

        /* Der Hintergrund-Balken */
        #main-bar {
            position: relative;
            height: 90px;
            width: 0; /* Startet bei 0 für Reveal-Effekt */
            background: rgba(10, 10, 10, 0.98);
            display: flex;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transition: width 0.6s cubic-bezier(0.8, 0, 0.2, 1);
        }

        /* Rote Akzent-Leiste (Pinsel-Effekt) */
        #accent-line {
            position: absolute;
            left: 0; top: 0;
            width: 12px;
            height: 100%;
            background: #ff0000;
            transform: scaleY(0);
            transition: transform 0.4s 0.3s cubic-bezier(0.8, 0, 0.2, 1);
        }

        /* Text-Maskierung: Text "schiebt" sich ins Sichtfeld */
        .content-mask {
            overflow: hidden;
            padding: 0 40px 0 35px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.5s 0.5s ease-out;
        }

        /* Status: Aktiviert */
        #event-wrapper.active #main-bar { width: 550px; }
        #event-wrapper.active #accent-line { transform: scaleY(1); }
        #event-wrapper.active .content-mask { opacity: 1; transform: translateX(0); }

        .label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #ff0000;
            margin-bottom: 2px;
        }

        .player-name {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .detail-text {
            font-size: 16px;
            color: rgba(255,255,255,0.6);
            font-style: italic;
            margin-top: 4px;
        }

        /* Timer-Fortschritt am unteren Rand (sehr dezent) */
        #timer-progress {
            position: absolute;
            bottom: 0; left: 0;
            height: 3px;
            width: 0%;
            background: #ff0000;
        }

        #event-wrapper.active #timer-progress {
            animation: countdown 5s linear forwards;
        }

        @keyframes countdown {
            from { width: 100%; }
            to { width: 0%; }
        }
    </style>
</head>
<body>

    <div id="event-wrapper">
        <div id="main-bar">
            <div id="accent-line"></div>
            <div class="content-mask">
                <div id="label" class="label">Tor erzielt</div>
                <div id="player" class="player-name">-</div>
                <div id="detail" class="detail-text">-</div>
            </div>
            <div id="timer-progress"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfChQFOjIgBIcXPd57MTalvRrHFXr4UzM",
            authDomain: "obs-overlay-2950c.firebaseapp.com",
            databaseURL: "https://obs-overlay-2950c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "obs-overlay-2950c",
            storageBucket: "obs-overlay-2950c.firebasestorage.app",
            messagingSenderId: "1094353952185",
            appId: "1:1094353952185:web:da70794c9e5104fda22a68"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const wrapper = document.getElementById('event-wrapper');
        
        let initialLoad = true;

        db.ref('lastEvent').on('value', (snapshot) => {
            if (initialLoad) {
                initialLoad = false;
                return;
            }
            const data = snapshot.val();
            if (data) {
                const label = document.getElementById('label');
                const player = document.getElementById('player');
                const detail = document.getElementById('detail');
                const accent = document.getElementById('accent-line');
                const progress = document.getElementById('timer-progress');

                // Daten setzen
                if (data.type === 'goal') {
                    label.innerText = "Tor erzielt";
                    label.style.color = "#ff0000";
                    accent.style.background = "#ff0000";
                    progress.style.background = "#ff0000";
                    player.innerText = data.player;
                    detail.innerText = data.assist ? `Assist: ${data.assist}` : "Einzelleistung";
                } else {
                    label.innerText = "Zeitstrafe";
                    label.style.color = "#ffffff";
                    accent.style.background = "#ffffff";
                    progress.style.background = "#ffffff";
                    player.innerText = data.player;
                    detail.innerText = `Dauer: ${data.duration}`;
                }

                // Animation Sequenz
                wrapper.classList.remove('active');
                void wrapper.offsetWidth; // Trigger Reflow
                wrapper.classList.add('active');

                // Nach 5 Sekunden wieder ausfahren
                setTimeout(() => {
                    wrapper.classList.remove('active');
                }, 5000);
            }
        });
    </script>
</body>
</html>
